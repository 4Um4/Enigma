[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enigma-backend"
version = "0.5.3.8.7"
description = "Local AI Dungeon Master Backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.9",
  "psutil==6.0.0",
  "pypdf==5.1.0",
  "httpx==0.28.1",
  "aiohttp==3.10.11",
  "pytest==8.3.3",
  "pymorphy3",
  "pygame==2.6.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pypdf==5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --ignore=backend/tests/sandbox/test_causal_bridge_integration.py"
minversion = 7.0
filterwarnings = [
  "ignore::DeprecationWarning:uvicorn",
  "ignore::pytest.PytestCollectionWarning",
]

[tool.hatch.build.targets.wheel.shared-data]
"app" = "app"

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.sandbox.*"]
ignore_errors = true

# Мягкий режим для сервисов (они содержат много легаси-кода)
[[tool.mypy.overrides]]
module = ["app.services.*"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
ignore_missing_imports = true

# Мягкий режим для агентов и API
[[tool.mypy.overrides]]
module = ["app.agents.*", "app.api.*", "app.core.*"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
ignore_missing_imports = true