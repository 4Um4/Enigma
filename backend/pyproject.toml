[project]
name = 'enigma-backend'
version = '0.5.4.5.4'
description = 'Local AI Dungeon Master Backend'
readme = 'README.md'

[project.optional-dependencies]
dev = [
  'httpx==0.28.1',
  'pypdf==5.1.0',
]

[tool.pytest.ini_options]
pythonpath = ['backend']
testpaths = ['tests']

[tool.mypy]
python_version = '3.11'
doctest = false
mypy_path = 'backend'
explicit_package_bases = true
strict = false
warn_return_any = true
show_error_codes = true
warn_unused_configs = true

exclude = '^.*(backend/tests|backend/tests/sandbox|_archive|diagnostics|frontend|lint_project|game_launcher|harness).*'

[[tool.mypy.overrides]]
module = ['app.*', 'backend.app.*', 'core.*', 'domain.*', 'models.*', 'services.*']
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ['yaml', 'psutil', 'networkx', 'pymorphy3', 'pytest_asyncio', 'hypothesis', 'pygame', 'freetype_py', 'httpx', 'aiohttp', 'fastapi', 'uvicorn', 'pydantic', 'pydantic_settings', 'python_multipart']
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ['scripts.*', 'reports.*', 'frontend.*', 'payload.*', 'download.*', 'config.*', 'publish_release.*', 'updater.*', 'tools.*']
disallow_untyped_defs = false
ignore_missing_imports = true
ignore_errors = true



[[tool.mypy.overrides]]
module = ['tests.*']
disallow_untyped_defs = false
warn_return_any = false
ignore_missing_imports = true
ignore_errors = true
