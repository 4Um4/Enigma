[tool.mypy]
python_version = "3.11"
doctest = false
mypy_path = "backend"
explicit_package_bases = true
strict = false
warn_return_any = true
show_error_codes = true
warn_unused_configs = true

# Полное исключение из проверки: тесты, скрипты, отчеты, отладочные файлы
exclude = "^(.*[\\\\/])(_archive|diagnostics|frontend)[\\\\/]?|^(.*[\\\\/])*game_launcher\\.py$"

# Мягкий режим для всех модулей приложения и служебных пакетов
[[tool.mypy.overrides]]
module = ["app.*", "backend.app.*", "core.*", "domain.*", "models.*", "services.*"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
ignore_missing_imports = true
ignore_errors = true

# Внешние библиотеки без typed-стабов
[[tool.mypy.overrides]]
module = ["yaml", "psutil", "networkx", "pymorphy3", "pytest_asyncio", "hypothesis", "pygame", "freetype_py", "httpx", "aiohttp", "fastapi", "uvicorn", "pydantic", "pydantic_settings", "python_multipart"]
ignore_missing_imports = true

# Игнорируем скрипты
[[tool.mypy.overrides]]
module = ["scripts.*", "reports.*", "frontend.*", "payload.*", "download.*", "config.*", "publish_release.*", "updater.*", "tools.*"]
disallow_untyped_defs = false
ignore_missing_imports = true
ignore_errors = true

