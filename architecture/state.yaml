domain: STATE
description: "Персистентность и контекст: абстрактный порт, SQLite/JSON адаптеры, context builder. Runtime truth = SQLite."

nodes:
  PersistencePort:
    type: interface
    layer: Domain
    label: "Persistence Port (ABC)"
    description: "Абстракция: save_scene, load_scene, save_npcs, atomic_commit. Реализации: SQLite, JSON."
    code_ref: "state/persistence_port.py"
  SqlitePersistenceAdapter:
    type: service
    layer: Infrastructure
    label: "SQLite Persistence Adapter"
    description: "Key-value JSON blob в state_kv. json.dumps с default handler для set. Runtime truth."
    code_ref: "state/sqlite_persistence_adapter.py"
  JsonPersistenceAdapter:
    type: service
    layer: Infrastructure
    label: "JSON Persistence Adapter (Legacy)"
    description: "Файловая персистентность. Fallback когда SQLite недоступен."
    code_ref: "state/json_persistence_adapter.py"
  ContextBuilder:
    type: service
    layer: Application
    label: "Context Builder"
    description: "build_context: scene_state → TickContext. get_npc_context: фильтрация по npc_id."
    code_ref: "state/context_builder.py"

edges:
  - from: PersistencePort
    to: SqlitePersistenceAdapter
    label: "primary implementation"
    condition: "Default. Atomic commit. Runtime truth (Устав §4.2.1)."
    code_ref: "state/sqlite_persistence_adapter.py"
  - from: PersistencePort
    to: JsonPersistenceAdapter
    label: "fallback implementation"
    condition: "Legacy. No transactions = data corruption risk (Устав §4.2.3)."
    code_ref: "state/json_persistence_adapter.py"
  - from: StateApplicator
    to: PersistencePort
    label: "atomic_commit(campaign_id, scene_state, npc_dicts)"
    condition: "End of tick. All or nothing (Устав §4.2.1)."
    code_ref: "npc/state_applicator.py"
  - from: ContextBuilder
    to: TickOrchestrator
    label: "build_context → TickContext"
    condition: "Every tick start"
    code_ref: "state/context_builder.py"

constraints:
  - source: JsonPersistenceAdapter
    target: RuntimeTruth
    rule: "FORBIDDEN: JSON as runtime truth (Устав §4.2.2)"
    condition: "JSON = fallback/snapshot. No transactions = data corruption. SQLite is primary."
    code_ref: "Устав §4.2.2"
    severity: CRITICAL
  - source: StateApplicator
    target: PersistencePort
    rule: "REQUIRED: atomic_commit for all saves (Устав §4.2.1)"
    condition: "Three separate JSON files = desync bug. Must commit atomically."
    code_ref: "Устав §4.2.1"
    severity: CRITICAL
  - source: SqlitePersistenceAdapter
    target: JSON
    rule: "REQUIRED: json.dumps with default handler for set (ADR-117)"
    condition: "Python set types must be serialized. Without handler = TypeError."
    code_ref: "sqlite_persistence_adapter.py:76"
    adr_ref: "ADR-117"
    severity: HIGH
  - source: NPCLoader
    target: NPCState
    rule: "REQUIRED: _apply_runtime_overlay must include affective_load, emotion, emotion_delta, body_state, perceptual_kernel, narrative_cache in whitelist (Invariant 1, ADR-118)"
    condition: "Without these keys in _RUNTIME_TOP_LEVEL_KEYS, computed state is overwritten by static config on every disk read → DOUBLE TRUTH"
    code_ref: "npc/npc_loader.py:_RUNTIME_TOP_LEVEL_KEYS"
    adr_ref: "ADR-118"
    severity: CRITICAL
  - source: GameLoop
    target: LifeEngine
    rule: "REQUIRED: engine.update_cache() after load_npcs_merged() — prevent re-reading disk every player turn (Invariant 1, ADR-118)"
    condition: "Without cache priming, every player turn reads static YAML from disk and overwrites computed affective_load/emotion/body_state"
    code_ref: "game_loop/__init__.py:_load_npcs_with_runtime"
    adr_ref: "ADR-118"
    severity: CRITICAL
  - source: ProjectionEngine
    target: Simulation
    rule: "REQUIRED: apply_changes = pure projection operator, NOT simulator (ADR-O-201)"
    condition: "6 mutations identified in scene_state_manager.apply_change(): (1) SpatialService.build_for_location (2) random.uniform (3) is_blocked_by_wall + find_path (4) traversal_dict construction (5) node.x/y → local_position (6) direct dict mutation before apply. All must migrate to EventCompiler. Projection = state[t+1] = state[t] ⊕ ThickSceneChange[]."
    code_ref: "scene_state_manager.py:1153-1446"
    adr_ref: "ADR-O-201"
    severity: CRITICAL
  - source: ProjectionEngine
    target: WorldKnowledge
    rule: "FORBIDDEN: apply_changes queries world state beyond target entity (ADR-O-201)"
    condition: "Pure projection reads only the entity being mutated. No SpatialService queries, no active_traversals reads, no pathfinding lookups. All context provided in ThickSceneChange."
    code_ref: "scene_state_manager.py:apply_change"
    adr_ref: "ADR-O-201"
    severity: HIGH

ownership:
  PersistenceState:
    owner: "SqlitePersistenceAdapter (primary)"
    creates: "atomic_commit"
    modifies: "atomic_commit (overwrite)"
    reads: "load_scene, load_npc_runtime"
    constraint: "SQLite = runtime truth. JSON = legacy/fallback. Single writer."
  SnapshotState:
    owner: "TickOrchestrator (creates, freezes)"
    creates: "WorldSnapshot per tick from scene_state + spatial_graph"
    modifies: "N/A (immutable)"
    reads: "EventCompiler (sole consumer)"
    constraint: "ADR-O-201: Frozen copy of all state needed for event compilation. Must include boundary_map, spatial_graph, rng_seed. No references to live objects — deep copy required. Violation of immutability = non-deterministic replay."
    adr_ref: "ADR-O-201"
  ProjectionState:
    owner: "SceneStateManager (apply_change refactored to ProjectionEngine)"
    creates: "State mutations via dict assignment only"
    modifies: "scene_state entries from ThickSceneChange fields"
    reads: "ThickSceneChange (complete physical contract, no computation needed)"
    constraint: "ADR-O-201: Pure function. No branching >1 level, no service calls, no RNG, no pathfinding. state[t+1] = state[t] ⊕ ThickSceneChange[]. Migration phases: 0 (shadow) → 1 (dual rail) → 2 (alignment) → 3 (takeover)."
    adr_ref: "ADR-O-201"