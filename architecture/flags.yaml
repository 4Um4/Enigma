    adr: ADR-O-409
    owner: master
    note: "S306/S308 закрыты; флип + CI-fix 84a83767 (16 падений: UnboundLocalError + стабы)"
  COMMITMENT_REGISTRY_ENABLED:
    type: module-const
    read_mode: import
    default: "true"
    verdict: ROLLOUT-ON
    adr: ADR-O-363
    owner: master
    note: "born-True c4b75107 (GORAN 12/12); вся эпоха S215+ при ON"
  D8P_ENABLED:
