# path: architecture/flags.yaml
# Назначение: COV-0 Flag Registry (COV-D73 -> COV-GC-04). Вердикты Мастера:
#   (1) цепочка flags.yaml -> lint -> IPT обязательна (ручная синхронизация запрещена);
#   (2) философия включения: контур с игровым смыслом и закрытым гейтом по умолчанию
#       ROLLOUT-ON-кандидат; OFF требует обоснования, а не наоборот.
# КОНТРАКТ ПРИЁМКИ ROLLOUT-ON (урок 84a83767: micro-подмножество пропустило 11
# из 16 падений): флип default OFF->ON обязан проходить FULL pytest + IPT.
# Границы v1: doc-drift проверяется на def-site (±8 строк определения);
# usage-site комментарии (кейс npc_dialogue_subscriber:307) — v2; числовые ручки —
# verdict CALIBRATION (полнота без тумблерной семантики).

domain: "COV-0"
description: "Реестр rollout-флагов: единственный источник вердиктов; факты (имя/дефолт/режим чтения) добывает линтер из кода — расхождение = RED."

verdicts:
  ROLLOUT-ON: "включён в проде; контур жив; приёмка = full-pytest + IPT"
  ROLLOUT-PENDING: "контур готов; включение — отдельный вердикт Мастера (цикл: включили -> погоняли -> разобрали)"
  KEEP-LOG: "диагностический/lab-флаг; не прод-семантика"
  BURY: "мёртвый/легаси; кандидат удаления (удаление = отдельный шаг)"
  INFRA: "инфраструктурный (кодировка, токены, URL); проверяется только полнота"
  AUDIT-NEEDED: "не исследован; С ЭТИМ СТАТУСОМ COV-GC-04 НЕ ЗАКРЫВАЕТСЯ"
  CALIBRATION: "числовая ручка; не тумблер"

