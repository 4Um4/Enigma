    read_mode: call
    default: ""
    effective_default: "1"
    verdict: ROLLOUT-ON
    adr: ADR-O-382
    owner: A
    note: "модульный default OFF; main.py setdefault -> прод ON (вердикт Мастера)"
  IDLE_EVENTS_PROJECTION_ENABLED:
