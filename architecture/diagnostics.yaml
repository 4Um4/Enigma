domain: DIAGNOSTICS
description: "Наблюдаемость и диагностика. CDS читает следы системы, не создавая причинности. Инвариант 3: Пред-шинные отказы не молчат."
nodes:
  CausalObserver:
    type: service
    layer: Application
    label: "Causal Observer (CDS)"
    description: "Passive observer. Reads logs and traces. Must not mutate runtime state."
  TickHealthChecker:
    type: service
    layer: Application
    label: "Tick Health Checker"
    description: "Parses pre-bus failures and affect decay fails. Produces TickHealthReport (ADR-120)."
  PatternRegistry:
    type: service
    layer: Application
    label: "Pattern Registry (Compiled Regex)"
    description: "Contains patterns for pre-bus failures: pipeline_critical, causality_crash, phase8_crash, tick_orch_error, affect_decay_fail (ADR-120)."
  DNAComputer:
    type: service
    layer: Application
    label: "DNA Metrics Computer"
    description: "Computes DNASnapshot and DNADelta. Calculates PFI (Pre-Bus Failure Index)."
  DeterministicClock:
    type: domain
    layer: Domain
    label: "Deterministic Clock"
  CausalTrace:
    type: domain
    layer: Domain
    label: "Causal Trace"
  GameStdout:
    type: queue
    layer: Infrastructure
    label: "Game Process stdout/logs"
  GitHistory:
    type: database
    layer: Infrastructure
    label: "Git Log & File System"
  Router:
    type: service
    layer: Application
    label: "DM Router (Execution Gate)"
    description: "ADR-147: Single point of LLM execution. Notifies CDS of stream start/end for observability. Bypass (e.g. direct stream_tokens) causes CDS blindness (CVS=0.00)."
    code_ref: "dm_router.py"
    adr_ref: "ADR-147"
  TickHealthReport:
    type: dto
    layer: Domain
    label: "Tick Health Report"
    description: "Contains prebus_failures and affect_decay_fails counts for PFI calculation (ADR-120)."
  DNASnapshot:
    type: dto
    layer: Domain
    label: "DNA Snapshot"
    description: "Accumulated metrics including PFI (Pre-Bus Failure Index = prebus_failures / total_ticks * 100)."
  DNADelta:
    type: dto
    layer: Domain
    label: "DNA Delta"
    description: "Diff between sessions. Includes PFI change to track stability trends."
  DriftLaboratory:
    type: service
    layer: Application
    label: "Drift Laboratory (SUPERBOX)"
    description: "S85.3: Stress-tests pipeline. Idle stability mode verifies traversal lifecycle and node visits."
  InvariantHealthChecker:
    type: service
    layer: Application
    label: "Invariant Health Checker"
    description: "Post-mortem analyzer. Sliding window over 10 ticks. Catches silent degradations (TIME-FREEZE, NPC-FROZEN, DIALOGUE-PIPELINE-BROKEN) by diff, not pattern match."
    code_ref: "health_checkers/invariant_health.py"
    adr_ref: "ADR-INV-DEF"
  SimulationIntegrityError:
    type: domain
    layer: Domain
    label: "Simulation Integrity Error"
    description: "Raised in pipeline on invariant violation. Machine-readable format for CDS. Kills tick loudly."
    code_ref: "app/errors.py"
    adr_ref: "ADR-INV-DEF"
  InvariantViolation:
    type: dto
    layer: Domain
    label: "Invariant Violation"
    description: "Post-mortem DTO for LAST_SESSION.md. Contains suspect_files and powershell_check."
    code_ref: "health_checkers/invariant_health.py"
    adr_ref: "ADR-INV-DEF"
  IPT:
    type: service
    layer: Application
    label: "Invariant Probe Tests (IPT)"
    description: "Layer 'BEFORE'. Runs 6 invariants in minimal world. <5 sec. Required before commit."
    code_ref: "backend/tests/IPT.py"
    adr_ref: "ADR-INV-DEF"
edges:
  - from: GameStdout
    to: CausalObserver
    label: "reads logs"
    condition: "Regex patterns, pipe/file read"
    code_ref: "causal_observer.py"
  - from: GitHistory
    to: CausalObserver
    label: "reads git log & TODOs"
    condition: "Every session start"
    code_ref: "causal_observer.py"
  - from: DeterministicClock
    to: CausalTrace
    label: "provides tick context"
  - from: CausalObserver
    to: CausalTrace
    label: "writes traces"
    condition: "Passive, try/except isolated"
    code_ref: "causal_observer.py"
  - from: CausalObserver
    to: TickHealthChecker
    label: "dispatches parsed events"
    condition: "Pattern match from registry"
    code_ref: "causal_observer.py:_dispatch"
  - from: PatternRegistry
    to: CausalObserver
    label: "provides compiled patterns"
    condition: "COMPILED dict at init"
    code_ref: "pattern_registry.py"
  - from: TickHealthChecker
    to: DNAComputer
    label: "provides TickHealthReport"
    condition: "After log parsing complete"
    code_ref: "dna_metrics.py"
  - from: DNAComputer
    to: CausalTrace
    label: "writes DNA snapshot + PFI"
    condition: "After session end"
    code_ref: "dna_metrics.py"
  - from: Router
    to: CausalObserver
    label: "notify_stream_start/end — LLM execution gate (ADR-147)"
    condition: "On LLM call start/stop. Prevents CDS blindness during streaming."
    code_ref: "dm_router.py"
    adr_ref: "ADR-147"
  - from: TickHealthChecker
    to: TickHealthReport
    label: "produces health report"
    condition: "Aggregates prebus_failures and affect_decay_fails"
  - from: DNAComputer
    to: DNASnapshot
    label: "computes snapshot with PFI"
  - from: DNAComputer
    to: DNADelta
    label: "computes delta between sessions"
  - from: DriftLaboratory
    to: CausalTrace
    label: "records drift snapshots"
    condition: "S85.3: Idle stability test logs activity changes and traversals."
    code_ref: "drift_laboratory.py"
    adr_ref: "ADR-S85.3"
  - from: BeliefCrystallizationEngine
    to: CausalObserver
    label: "logs crystallization & decay events"
    condition: "S85.2: CDS observes belief formation to detect stagnation or hyper-instability."
    code_ref: "belief_crystallization_engine.py"
    adr_ref: "ADR-O-305"
  # --- INVARIANT DEFENSE SYSTEM ---
  - from: TickOrchestrator
    to: GameStdout
    label: "emits [TICK_ORCH] summary"
    condition: "Every tick end: tick, game_time, decisions, verbal, moved. Feeds InvariantHealthChecker."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-INV-DEF"
  - from: PostDecision
    to: SimulationIntegrityError
    label: "raises on INV-DIALOGUE-PIPELINE"
    condition: "If communication_intents empty but verbal decisions > 0."
    code_ref: "phases/post_decision.py"
    adr_ref: "ADR-INV-DEF"
  - from: TickOrchestrator
    to: SimulationIntegrityError
    label: "raises on INV-TIME-FREEZE"
    condition: "If game_time_seconds does not grow."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-INV-DEF"
  - from: WorldSnapshotBuilder
    to: SimulationIntegrityError
    label: "raises on INV-TRAV-DICT or INV-NPC-NAME"
    condition: "If active_traversals is not dict or NPC has no name."
    code_ref: "integration/world_snapshot_builder.py"
    adr_ref: "ADR-INV-DEF"
  - from: CausalObserver
    to: InvariantHealthChecker
    label: "feeds [TICK_ORCH] and [SIM_INTEGRITY] lines"
    condition: "Parsed via new patterns in PatternRegistry."
    code_ref: "causal_observer.py:_dispatch"
    adr_ref: "ADR-INV-DEF"
  - from: InvariantHealthChecker
    to: InvariantViolation
    label: "produces violations"
    condition: "Post-mortem check after 10 ticks or on runtime crash."
    code_ref: "health_checkers/invariant_health.py"
    adr_ref: "ADR-INV-DEF"
  - from: InvariantHealthChecker
    to: DNAComputer
    label: "provides invariant_violations"
    condition: "For DNA metrics aggregation."
    code_ref: "dna_metrics.py"
    adr_ref: "ADR-INV-DEF"
  - from: IPT
    to: GameLoop
    label: "runs idle_tick in isolated world"
    condition: "Layer BEFORE. Executed by LLM before commit."
    code_ref: "backend/tests/IPT.py"
    adr_ref: "ADR-INV-DEF"
constraints:
  - source: CausalObserver
    target: Runtime_State
    rule: "FORBIDDEN: Feedback loop into simulation"
    code_ref: "Устав §11.1"
  - source: CDS
    target: Pipeline
    rule: "FORBIDDEN: Interrupt causal flow on crash"
    code_ref: "Устав §11.2"
  - source: TickOrchestrator
    target: CausalObserver
    rule: "REQUIRED: Log pre-bus failures as [PIPELINE][CRITICAL], [PHASE8_CRASH], [AFFECT_DECAY] (Invariant 3, ADR-120)"
    condition: "logger.warning with structured tags. logger.debug FORBIDDEN for crashes."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-120"
    severity: CRITICAL
  - source: TickHealthChecker
    target: DNAComputer
    rule: "REQUIRED: Report prebus_failures and affect_decay_fails in DNASnapshot — PFI metric (Invariant 3, ADR-120)"
    condition: "PFI (Pre-Bus Failure Index) = prebus_failures / total_ticks * 100. Measures pipeline stability."
    code_ref: "dna_metrics.py"
    adr_ref: "ADR-120"
    severity: HIGH
  - source: Router
    target: CausalObserver
    rule: "REQUIRED: Notify stream start/end for observability (ADR-147)"
    condition: "Direct streaming bypassing Router causes CDS blindness (CVS=0.00). Router is the single execution gate."
    code_ref: "dm_router.py"
    adr_ref: "ADR-147"
    severity: HIGH
  - source: DriftLaboratory
    target: SceneState
    rule: "REQUIRED: Read spatial positions from scene_state[npc_positions] (SSOT), not LifeEngine cache (ADR-S85.3)"
    condition: "Metrics like UNIQUE_NODES_VISITED must observe runtime truth, not diagnostic projection."
    code_ref: "drift_laboratory.py"
    adr_ref: "ADR-S85.3"
    severity: HIGH
  # --- PROBE → TELEMETRY TRANSITION (ADR-151) ---
  - source: Any
    target: PrintProbe
    rule: "REQUIRED: Print probes MUST NOT be deleted without replacement (ADR-151)"
    condition: "Three tiers: 🟢 Essential (print: GATE_*, NPC_SET, DRF_*, TIFL_DRIFT, ZOMBIE, BELIEF), 🟡 Condensed (logger.debug: NEED_TRACE, SCHED_TRACE, AFF_*), 🔴 Removed (deleted entirely). Empty blocks after removal = SyntaxError."
    code_ref: "tick_orchestrator.py, life_engine.py, movement_engine.py, belief_crystallization_engine.py"
    adr_ref: "ADR-151"
    severity: HIGH
  - source: Any
    target: EmptyBlock
    rule: "FORBIDDEN: Empty code block after probe removal — causes IndentationError (ADR-151)"
    condition: "When replacing print() with comment or logger.debug, ensure the containing block (if/else/for) has at least one executable statement or pass."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-151"
    severity: CRITICAL
  # --- INVARIANT DEFENSE SYSTEM ---
  - source: Any
    target: SimulationIntegrityError
    rule: "FORBIDDEN: Catching SimulationIntegrityError in try/except. Let the pipeline crash."
    code_ref: "app/errors.py"
    adr_ref: "ADR-INV-DEF"
    severity: CRITICAL
  - source: LLM_Architect
    target: IPT
    rule: "REQUIRED: Run `python backend/tests/IPT.py` before closing a step."
    condition: "Layer BEFORE. 6 invariants in 5 seconds."
    code_ref: "backend/tests/IPT.py"
    adr_ref: "ADR-INV-DEF"
    severity: HIGH
  - source: LLM_Architect
    target: LAST_SESSION
    rule: "REQUIRED: Read 🔴 RED INVARIANTS section before starting new work."
    condition: "Layer AFTER. Generated by CausalObserver post-mortem."
    code_ref: "reports/LAST_SESSION.md"
    adr_ref: "ADR-INV-DEF"
    severity: HIGH