domain: FRONTEND
description: "Фронтенд, Эмбодимент и API мост. Сенсорный орган игрока, искажающийся вместе с аватаром."
nodes:
  GameScreen:
    type: service
    layer: UI
    label: "Pygame GameScreen"
  TextInput:
    type: service
    layer: UI
    label: "TextInput (Resistance Medium)"
  PresentationFirewall:
    type: service
    layer: UI
    label: "Presentation Firewall"
  PerceptualMomentum:
    type: service
    layer: UI
    label: "Perceptual Momentum (S-curve)"
  I18n:
    type: service
    layer: UI
    label: "Localization Module (i18n)"
  SceneRenderer:
    type: service
    layer: UI
    label: "Scene Renderer (Map & HUD)"
  SpriteRegistry:
    type: service
    layer: UI
    label: "Sprite Registry (Tile Provider)"
  APIRoutes:
    type: api
    layer: Infrastructure
    label: "FastAPI Routes"
edges:
  - from: GameScreen
    to: APIRoutes
    label: "POST /action (IntentDTO)"
    condition: "On Enter key"
    code_ref: "api_client.py"
    edge_type: thick
  - from: APIRoutes
    to: TickOrchestrator
    label: "resolve_player_intent()"
    condition: "Validate DTO"
    code_ref: "routes.py"
  - from: StateApplicator
    to: APIRoutes
    label: "WorldSnapshotDTO + will_conflict"
    condition: "End of action tick"
    code_ref: "routes.py"
    adr_ref: "ADR-068"
  - from: APIRoutes
    to: GameScreen
    label: "JSON Response"
    condition: "ActionQueue poll"
    code_ref: "api_client.py"
  - from: GameScreen
    to: APIRoutes
    label: "GET /api/world_state (polling)"
    condition: "Idle tick / read-only observation"
    code_ref: "api_client.py"
    adr_ref: "ADR-TZ03-1"
  - from: GameScreen
    to: APIRoutes
    label: "POST /api/game/action/stream (SSE)"
    condition: "Progressive rendering (future)"
    code_ref: "api_client.py"
    adr_ref: "ADR-TZ03-1"
  - from: GameScreen
    to: TextInput
    label: "infect() - motor resistance"
    condition: "will_conflict_data not None"
    code_ref: "game_screen.py:808"
    adr_ref: "ADR-039"
    edge_type: dotted
  - from: GameScreen
    to: PresentationFirewall
    label: "sanitize_perceptual_input()"
    condition: "On avatar_state update"
    code_ref: "game_screen.py:890"
  - from: PresentationFirewall
    to: PerceptualMomentum
    label: "SanitizedPerceptualVectors"
    condition: "S-curve inertia"
    code_ref: "game_screen.py:893"
  - from: GameScreen
    to: I18n
    label: "t(), activity_ru(), manifest_color()"
    condition: "All user-facing strings"
    code_ref: "game_screen.py, scene_renderer.py"
    adr_ref: "ADR-i18n"
  - from: SceneRenderer
    to: SpriteRegistry
    label: "get_entity_sprite(type)"
    condition: "Rendering entities & obstacles"
    code_ref: "scene_renderer.py"
    adr_ref: "ADR-TZ6-2"
  - from: APIRoutes
    to: GameScreen
    label: "manifestations (List[ManifestationDTO])"
    condition: "WorldSnapshot.player_perception"
    code_ref: "world_snapshot_builder.py"
    adr_ref: "ADR-O-147"
constraints:
  - source: Frontend
    target: BackendInternals
    rule: "FORBIDDEN: Import backend.app (Устав §1.1)"
    code_ref: "Устав §1.1"
  - source: APIRoutes
    target: NPCState
    rule: "FORBIDDEN: Pass internal state to UI"
    code_ref: "Устав §6.1"
  - source: GameScreen
    target: SpatialObstacles
    rule: "FORBIDDEN: Boolean collision check (must use Push-out Resolution)"
    condition: "Prevents Corner Trap between furniture (ADR-097)"
    code_ref: "game_screen.py:188-247"
    adr_ref: "ADR-097"
  - source: SceneRenderer
    target: SpatialObstacles
    rule: "FORBIDDEN: Treat obstacle x,y as center (must use as top-left corner)"
    condition: "Matches backend contract in scene_state_manager.py:559-567 (ADR-098)"
    code_ref: "scene_renderer.py:263-270"
    adr_ref: "ADR-098"
  - source: GameScreen
    target: Emotion
    rule: "FORBIDDEN: Show emotions (fearful, anxious) — only observable manifestations (tense, rigid)"
    condition: "Player perceives body, not mind (ADR-O-147)"
    code_ref: "game_screen.py"
    adr_ref: "ADR-O-147"
  - source: GameScreen
    target: PerceptionData
    rule: "FORBIDDEN: Compute manifest in GameScreen — only read from perception data"
    condition: "Backend is sole source of truth (ADR-O-147)"
    code_ref: "game_screen.py"
    adr_ref: "ADR-O-147"
  - source: GameScreen
    target: Manifestations
    rule: "FORBIDDEN: Mix cues and manifestations — separate channels"
    condition: "Different semantic layers (ADR-O-147)"
    code_ref: "phenomenology_projection_service.py, game_screen.py"
    adr_ref: "ADR-O-147"
  - source: GameScreen
    target: GameState
    rule: "FORBIDDEN: Mutate game_time_seconds (+=) in frontend. Backend is sole time authority."
    code_ref: "game_screen.py"
    adr_ref: "ADR-TZ03-1"
  - source: GameScreen
    target: AvatarState
    rule: "FORBIDDEN: Override avatar_state fields in frontend. Backend is sole avatar authority."
    code_ref: "game_screen.py"
    adr_ref: "ADR-TZ03-1"
  - source: GameScreen
    target: DialogJournal
    rule: "FORBIDDEN: Append to dialog_journal locally in frontend. Read from backend."
    code_ref: "game_screen.py"
    adr_ref: "ADR-TZ03-1"
  - source: GameScreen
    target: NPCNamesConfig
    rule: "FORBIDDEN: Use contextlib.suppress(Exception) on system boundaries. Use try/except with logger."
    code_ref: "game_screen.py"
    adr_ref: "ADR-TZ03-1"
  - source: GameLoopBridge
    target: SpatialOracle
    rule: "FORBIDDEN: Silent pass (except Exception: pass) in Spatial Oracle. Log errors."
    code_ref: "game_loop_bridge.py"
    adr_ref: "ADR-TZ03-1"
  - source: WorldSnapshotBuilder
    target: NPCPositionDTO
    rule: "REQUIRED: Return npc_positions as Dict[str, NPCPositionDTO], not List."
    code_ref: "world_snapshot_builder.py"
    adr_ref: "ADR-TZ03-1"
  - source: PeripheralCueDTO
    target: Frontend
    rule: "REQUIRED: Use cue_key field (renamed from cue_type)."
    code_ref: "snapshot.py"
    adr_ref: "ADR-TZ03-1"
  - source: _MinimalFrontendRegistry
    target: SpatialOracle
    rule: "REQUIRED: Implement find_chunks method."
    code_ref: "spatial_compilation_orchestrator.py"
    adr_ref: "ADR-TZ03-1"