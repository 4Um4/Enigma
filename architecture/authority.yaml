domain: AUTHORITY
description: "Воля, Давление, Решения и Социум. Подчинение требует легитимности. Решения из искривленного utility. Личность = направление разрядки."
nodes:
  WillpowerGate:
    type: service
    layer: Application
    label: "WillpowerGate (Cumulative Strain)"
  DecisionHub:
    type: service
    layer: Application
    label: "Decision Hub v2 (Utility Deformation)"
    style: {fill: "#e8f5e9", stroke: "#1b5e20", "stroke-width": "4px"}
    description: "S72: _context_relevance modulates event salience through drives_base. Delegates _compute_deltas to SocialDeltaEngine and _compute_risk to perceive_risk via RiskPerceptionProfile (ADR-O-146)."
    adr_ref: "§ENIGMA-S72, ADR-O-146"
  IntentEventAdapter:
    type: service
    layer: Application
    label: "Intent Event Adapter"
  DirectiveInterpreter:
    type: service
    layer: Domain
    label: "Directive Interpretation Subscriber"
    description: "NPIC (ADR-O-139): Body is gate of perception. Somatic Gate checks shock > 0.7 BEFORE semantic parsing. Fallback without body_state is FORBIDDEN."
    adr_ref: "ADR-O-139"
  CFRMSolver:
    type: service
    layer: Domain
    label: "Local Causal Solver (CFRM P2)"
    description: "S72: Produces raw signals only. NO fixed multipliers. Interpretation delegated to personality."
    adr_ref: "§ENIGMA-S72"
  BodyState:
    type: dto
    layer: Domain
    label: "Body State (Physiology)"
    description: "NPIC Sentinel (ADR-O-139). BODY_STATE_DISABLED constant when absent."
    adr_ref: "ADR-O-139"
  SourceID:
    type: dto
    layer: Domain
    label: "Source ID (Social Authority)"
  EventDTO:
    type: dto
    layer: Domain
    label: "Event DTO (NPC_SPOKE)"
  IntentCompressor:
    type: service
    layer: Application
    label: "Intent Compressor (Fast Path)"
  EmotionalVector:
    type: dto
    layer: Domain
    label: "Emotional Vector (Aggression/Fear)"
  AffectivePipeline:
    type: service
    layer: Application
    label: "Affective Pipeline (Emotion from Pressure)"
    description: "Runs in BOTH idle and player turn. Weights are drives-based (fear→threat, control→uncertainty, significance→anomaly). All thresholds personalized."
    adr_ref: "ADR-117, ADR-122, §ENIGMA-S72"
  LifeEngine:
    type: service
    layer: Application
    label: "Life Engine (Cache + Simulation)"
    description: "Owns _npc_cache. Owns Viability Pre-Generation Gate (ADR-O-137) and Arousal Gate (ADR-O-142A). Two-layer dispatch: need-driven (priority=0.8) overrides schedule (priority=0.6) when critical (ADR-149)."
    adr_ref: "ADR-117, ADR-O-137, ADR-O-142A, ADR-149, ADR-150"
  GameLoop:
    type: service
    layer: Application
    label: "Game Loop (Pipeline Controller)"
    description: "Contains Action Eligibility Gate (ADR-131). Death Guard v2 (ADR-137)."
    adr_ref: "ADR-117, ADR-131, ADR-137"
  PressureTranslator:
    type: service
    layer: Application
    label: "Pressure Translator (Somatic Veto)"
    description: "Translates PerceptualKernel + body_state into DecisionContext. NORMALIZES pain /100.0 (ADR-094 MSOC)."
    adr_ref: "ADR-094, GAP3"
  AvatarPresentationAssembler:
    type: service
    layer: Application
    label: "Avatar Presentation Assembler"
    adr_ref: "ADR-094, ADR-137"
  AvatarStateDTO:
    type: dto
    layer: Domain
    label: "Avatar State DTO (life_status + perceptual scalars)"
    adr_ref: "ADR-137"
  DRFBus:
    type: queue
    layer: Application
    label: "DRF Bus (Causal Field Bus)"
    description: "Instance-level bus. Owned by TickOrchestrator (ADR-134)."
    adr_ref: "ADR-134"
  DRFExecutionContext:
    type: dto
    layer: Application
    label: "DRF Execution Context (Scoped Causal Ledger)"
    description: "Scoped causal ledger: tick_id + npc_id + bus. Replaces bare drf_bus (ADR-136)."
    adr_ref: "ADR-136"
  NPCStateAdapter:
    type: service
    layer: Application
    label: "NPCState Adapter (Serialization Bridge)"
    adr_ref: "ADR-115, ADR-116, ADR-117"
  # --- PERSONALITY MATH LAYER (DOM-02 / DOM-10) ---
  ProfileMath:
    type: domain
    layer: Domain
    label: "Profile Math (Causal Geometry of Character)"
    description: "ADR-O-146: Аттракторная модель характера. Трёхфазная drive_multiplier(). Единственный источник множителей для SocialDeltaEngine и RiskPerceptionProfile. Изолирует домены друг от друга."
    code_ref: "decision/profile_math.py"
    adr_ref: "ADR-O-146"
  SocialDeltaEngine:
    type: domain
    layer: Domain
    label: "Social Delta Engine"
    description: "ADR-O-146: Заменяет инлайн _compute_deltas в DecisionHub. Модулирует социальные дельты через RelationshipResponseProfile."
    code_ref: "decision/social_deltas.py"
  VillageMemoryField:
    type: domain
    layer: Domain
    label: "Village Memory Field"
    description: "ADR-O-212: ЕДИНСТВЕННАЯ социальная истина. Функция аппроксимации поведения группы. Ingest = event-driven, Decay/Diffusion = tick-driven."
    code_ref: "social/village_memory_field.py"
    adr_ref: "ADR-O-212"
  SocialMemoryUpdater:
    type: service
    layer: Application
    label: "Social Memory Updater"
    description: "ADR-O-212: Обновляет VillageMemoryField. event-driven ingest + tick-driven decay/diffusion."
    code_ref: "social/social_memory_updater.py"
    adr_ref: "ADR-O-212"
  InstitutionalInertia:
    type: domain
    layer: Domain
    label: "Institutional Inertia"
    description: "ADR-O-212: Защита от экспоненциальной эскалации. target = f(consensus), actual += (target - actual) * adaptation_rate"
    code_ref: "social/institutional_inertia.py"
    adr_ref: "ADR-O-212"
  InstitutionLayer:
    type: domain
    layer: Domain
    label: "Village Institution Layer"
    description: "ADR-O-212: Медленные структурные коэффициенты мира. Рождается как агрегат давления памяти. Влияет через Decision Bias Layer."
    code_ref: "social/institutional_inertia.py"
    adr_ref: "ADR-O-212"
    adr_ref: "ADR-O-146"
  RiskPerceptionProfile:
    type: domain
    layer: Domain
    label: "Risk Perception Profile"
    description: "ADR-O-146: Двухфазная модель: compute_objective_risk() → объективная истина, perceive() → субъективное восприятие. desire НЕ входит (риск ≠ готовность рисковать)."
    code_ref: "decision/risk_profile.py, decision/risk.py"
    adr_ref: "ADR-O-146"
  RelationshipStore:
    type: domain
    layer: Domain
    label: "Relationship Store (SSOT)"
    description: "ADR-121: Единственный SSOT социальных отношений. Масштаб 0-100. Персистенция внутри NPCState ЗАПРЕЩЕНА."
    code_ref: "relationship_store.py"
    adr_ref: "ADR-121"
  IntentDomain:
    type: domain
    layer: Domain
    label: "Intent Domain (SURVIVAL/SOCIAL/ROUTINE/EXPLORATION)"
    description: "ADR-O-137: Онтологический базис намерений. Viability mask проекция PerceptualKernel → IntentDomain."
    code_ref: "domain/movement.py"
    adr_ref: "ADR-O-137"
edges:
  - from: WillpowerGate
    to: DecisionHub
    label: "provides resistance & identity_rigidity"
    condition: "trauma_markers > 0 -> +0.1 identity_rigidity"
    code_ref: "will.py:122-125"
    adr_ref: "GAP2 FIX"
    edge_type: thick
  - from: BodyState
    to: DirectiveInterpreter
    label: "Somatic Gate: shock > 0.7 blocks interpretation (ADR-O-139)"
    condition: "shock_impulse > 0.7 -> return []"
    code_ref: "directive_interpretation_subscriber.py:58"
    adr_ref: "GAP4 FIX"
    edge_type: dotted
  - from: BodyState
    to: DecisionHub
    label: "Somatic Veto"
    condition: "pain > 0.8 blocks FLEE; shock > 0.7 blocks ATTACK"
    code_ref: "pressure_translator.py:52"
    adr_ref: "GAP3 FIX"
    edge_type: dotted
  - from: SourceID
    to: DirectiveInterpreter
    label: "NPC-to-NPC legitimacy"
    condition: "fear_{source_id} > 0.3"
    code_ref: "directive_interpretation_subscriber.py:77-92"
    adr_ref: "GAP13 FIX"
  - from: DirectiveInterpreter
    to: DeltaBuffer
    label: "generates obedience/irritation"
    condition: "legitimacy > 0.3 -> obedience; else -> irritation"
    code_ref: "directive_interpretation_subscriber.py:93-97"
    adr_ref: "ADR-057"
  - from: IntentEventAdapter
    to: EventDTO
    label: "preserves semantic_action & target_id"
    condition: "Always if present in CommunicationIntent"
    code_ref: "intent_event_adapter.py:46-47"
    adr_ref: "GAP8 FIX"
  - from: CFRMSolver
    to: PlayerObserver
    label: "parses avatar psyche"
    code_ref: "local_causal_solver.py:320-324"
    adr_ref: "GAP7 FIX"
  - from: IntentCompressor
    to: EmotionalVector
    label: "injects emotions in Fast Path"
    condition: "ATTACK -> aggression=0.8; THREATEN -> aggression=0.5"
    code_ref: "intent_compressor.py:130"
    adr_ref: "ADR-088"
  - from: EmotionalVector
    to: WillpowerGate
    label: "provides emotional charge"
    code_ref: "will.py"
    adr_ref: "ADR-088"
  - from: AffectivePipeline
    to: DecisionHub
    label: "EmotionTag → _emotion_modifier() → utility deformation"
    condition: "FEARFUL: FLEE +0.35, ATTACK -0.25. ANGRY: ATTACK +0.30."
    code_ref: "decision_hub.py:966-994"
    adr_ref: "ADR-117"
    edge_type: thick
  - from: AffectivePipeline
    to: DeltaBuffer
    label: "EmotionPayload"
    code_ref: "tick_orchestrator.py:_run_affective_pipeline"
    adr_ref: "ADR-117"
  - from: ReactionSubscriber
    to: AffectivePipeline
    label: "sets emotion directly (bypasses accumulator)"
    condition: "Anti-DOUBLE TRUTH bootstrap required"
    code_ref: "reaction_subscriber.py:275"
    adr_ref: "ADR-117"
    edge_type: dotted
  - from: VitalStateEvaluator
    to: AvatarPresentationAssembler
    label: "body_state['life_status'] → AvatarStateDTO.life_status"
    code_ref: "avatar_presentation_assembler.py:30-37"
    adr_ref: "ADR-137"
  - from: AvatarPresentationAssembler
    to: AvatarStateDTO
    label: "assemble_avatar_presentation → normalized phenomenological projection"
    code_ref: "avatar_presentation_assembler.py:34-35"
    adr_ref: "ADR-094"
  - from: BodyState
    to: PressureTranslator
    label: "pain (normalized /100.0) + shock + blood_loss → Somatic Veto constraints"
    code_ref: "pressure_translator.py:53-64"
    adr_ref: "ADR-094"
  - from: PressureTranslator
    to: DecisionContext
    label: "DecisionContext with feasibility constraints"
    code_ref: "pressure_translator.py:57-64"
    adr_ref: "GAP3"
  - from: TickOrchestrator
    to: DRFBus
    label: "owns self._drf_bus (instance-level)"
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-134"
  - from: DRFBus
    to: DRFExecutionContext
    label: "drf_ctx = DRFExecutionContext(tick_id, npc_id, bus) — scoped per NPC"
    code_ref: "tick_orchestrator.py, npc_tick_pipeline.py"
    adr_ref: "ADR-136"
  # --- PERSONALITY MATH EDGES ---
  - from: ProfileMath
    to: SocialDeltaEngine
    label: "computes RelationshipResponseProfile multipliers"
    condition: "ADR-O-146: fear_from_aggression, trust_from_help etc. Pure function."
    code_ref: "decision/social_deltas.py"
    adr_ref: "ADR-O-146"
  - from: ProfileMath
    to: RiskPerceptionProfile
    label: "computes threat_sensitivity and sense_of_control"
    condition: "ADR-O-146: desire NOT included (risk ≠ readiness)."
    code_ref: "decision/risk_profile.py"
    adr_ref: "ADR-O-146"
  - from: SocialDeltaEngine
    to: DecisionHub
    label: "process(state, personality, event, intent) → List[StateDeltas]"
    condition: "Replaces inline _compute_deltas. Modulated by RelationshipResponseProfile."
    code_ref: "decision_hub.py"
    adr_ref: "ADR-O-146"
  # --- SOCIAL PHYSICS EDGES (ADR-O-212) ---
  - from: EventBus
    to: SocialMemoryUpdater
    label: "EventDTO (COMBAT/DEATH/SOCIAL)"
    condition: "Ingest on event occurrence"
    adr_ref: "ADR-O-212"
  - from: SocialMemoryUpdater
    to: VillageMemoryField
    label: "ingest(event) / decay()"
    condition: "Updates consensus_risk, witness_count, agent_profiles"
    adr_ref: "ADR-O-212"
  - from: VillageMemoryField
    to: InstitutionLayer
    label: "consensus_risk, myth_level"
    condition: "Drives target institutional state"
    adr_ref: "ADR-O-212"
  - from: InstitutionalInertia
    to: InstitutionLayer
    label: "adaptation_rate filter"
    condition: "actual += (target - actual) * α. Prevents instant escalation."
    adr_ref: "ADR-O-212"
  - from: InstitutionLayer
    to: DecisionHub
    label: "Decision Bias (effective_risk modifier)"
    condition: "effective_risk = base_risk * 0.6 + consensus_risk * 0.4"
    adr_ref: "ADR-O-212"
  - from: RiskPerceptionProfile
    to: DecisionHub
    label: "perceive_risk() replaces _compute_risk()"
    condition: "Two-phase model: objective risk → subjective perception. DecisionHub calls perceive_risk() instead of self._compute_risk()."
    code_ref: "decision_hub.py, decision/risk.py"
    adr_ref: "ADR-O-146"
  - from: RelationshipStore
    to: DecisionHub
    label: "provides read-only relationship_cache (0-100 scale)"
    condition: "ADR-121: SSOT. Cache is ephemeral per-tick projection. Consumers normalize 0-100 → 0-1."
    code_ref: "decision_hub.py"
    adr_ref: "ADR-121"
  - from: PerceptualKernel
    to: IntentDomain
    label: "Viability mask projection"
    condition: "ADR-O-137: threat_gradient > 0.3 → EXCLUDE ROUTINE domain. Gate stands BEFORE generators."
    code_ref: "life_engine.py"
    adr_ref: "ADR-O-137"
constraints:
  - source: DecisionHub
    target: Raw_Delta
    rule: "FORBIDDEN: Use T+0 pressure (Only T-1)"
    code_ref: "ADR-050"
    adr_ref: "Устав §3.5"
  - source: DirectiveInterpreter
    target: MovementIntent
    rule: "FORBIDDEN: Direct movement generation"
    code_ref: "ADR-043"
    adr_ref: "Social Physics"
  - source: IntentCompressor
    target: EmotionalVector
    rule: "FORBIDDEN: Return default 0.0 vector for ATTACK (ADR-088)"
    condition: "Must inject aggression > 0"
    code_ref: "ADR-088"
  - source: StateInterpreter
    target: EmotionTag
    rule: "FORBIDDEN: Derive psychological state from stress (ADR-104)"
