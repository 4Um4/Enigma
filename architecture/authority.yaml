    owner: "AffectivePipeline (via emotion_transition.py)"
    creates: "AffectivePipeline or ReactionSubscriber"
    modifies: "AffectivePipeline via EmotionPayload"
    reads: "DecisionHub (_emotion_modifier), Verbalization"
    constraint: "ONE owner. Engine MUST NOT assign dominant_emotion_hint."
    adr_ref: "§ENIGMA-S72"
  EmotionalVector:
    owner: "IntentCompressor"
    creates: "IntentCompressor"
    modifies: "N/A (immutable per intent)"
    reads: "WillpowerGate"
  WillState:
    owner: "WillpowerGate"
    creates: "WillpowerGate"
    modifies: "WillpowerGate"
    reads: "VerbalizationContext, DecisionHub"
  DecisionResult:
    owner: "DecisionHub"
    creates: "DecisionHub (from utility deformation)"
    modifies: "N/A (immutable)"
    reads: "StateApplicator, Verbalization"
  EmotionTag_utility:
    owner: "AffectivePipeline → DecisionHub"
    creates: "AffectivePipeline"
    modifies: "StateApplicator"
    reads: "DecisionHub (_emotion_modifier)"
