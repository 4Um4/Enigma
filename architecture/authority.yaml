sequences:
  - title: "Player Command Execution Flow"
    participants: [PlayerInput, DirectiveInterpreter, BodyState, WillpowerGate, DecisionHub]
    steps:
      - from: PlayerInput
        to: DirectiveInterpreter
        message: "1. Command received (source=player)"
      - from: BodyState
        to: DirectiveInterpreter
        message: "2. Somatic Gate: shock_impulse < 0.7 required (ADR-O-139)"
        type: dotted
      - from: DirectiveInterpreter
        to: WillpowerGate
        message: "3. Push directive_obedience pressure"
      - from: WillpowerGate
        to: DecisionHub
        message: "4. Compute resistance"
      - from: DecisionHub
        to: DecisionHub
        message: "5. Generate Intent (APPROACH/FLEE)"
  - title: "Fast Path Emotional Injection Flow (ADR-088)"
    participants: [IntentCompressor, EmotionalVector, WillpowerGate]
    steps:
      - from: IntentCompressor
        to: EmotionalVector
        message: "1. Map ActionType.ATTACK -> aggression=0.8"
      - from: EmotionalVector
        to: WillpowerGate
        message: "2. Evaluate resistance based on aggression"
  - title: "Affective Pipeline → DecisionHub Utility Flow (ADR-117, §ENIGMA-S72)"
    participants: [PerceptualKernel, AffectivePipeline, EmotionTag, DecisionHub]
    steps:
      - from: PerceptualKernel
        to: AffectivePipeline
        message: "1. threat × fear + uncertainty × control + anomaly × significance → affective_load"
      - from: AffectivePipeline
        to: EmotionTag
        message: "2. resolve_emotion_transition (personalized thresholds) → FEARFUL"
      - from: EmotionTag
        to: DecisionHub
        message: "3. _emotion_modifier: FEARFUL → FLEE +0.35, ATTACK -0.25"
      - from: DecisionHub
        to: DecisionHub
        message: "4. _context_relevance: personality determines what events mean"
  - title: "Personality Math Flow (ADR-O-146)"
    participants: [DrivesBase, ProfileMath, SocialDeltaEngine, RiskPerceptionProfile, DecisionHub]
    steps:
      - from: DrivesBase
        to: ProfileMath
        message: "1. fear=0.6, control=0.3, significance=0.4"
      - from: ProfileMath
        to: SocialDeltaEngine
        message: "2. RelationshipResponseProfile (fear_from_aggression=1.79)"
      - from: ProfileMath
        to: RiskPerceptionProfile
        message: "3. threat_sensitivity=1.5, sense_of_control=0.8 (NO desire)"
      - from: SocialDeltaEngine
        to: DecisionHub
        message: "4. Modulated social deltas (trust/fear)"
      - from: RiskPerceptionProfile
        to: DecisionHub
        message: "5. perceive_risk(): objective risk → subjective risk"
  - title: "Viability Pre-Generation Gate Flow (ADR-O-137)"
    participants: [PerceptualKernel, IntentDomain, LifeEngine, DecisionHub]
    steps:
      - from: PerceptualKernel
        to: IntentDomain
        message: "1. threat_gradient > 0.3 → EXCLUDE ROUTINE domain"
      - from: IntentDomain
        to: LifeEngine
        message: "2. Viability mask: Call ONLY SURVIVAL generators"
      - from: LifeEngine
        to: DecisionHub
        message: "3. Generate intent with domain=SURVIVAL"
      - from: DecisionHub
        to: DecisionHub
        message: "4. Post-gen filtering FORBIDDEN (zombie causality)"