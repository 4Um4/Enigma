domain: SPATIAL
description: "Пространство и локомоция. SpatialService — единственный авторитет координат. Boundary = интерфейс перехода. Актуализировано: S85.1 (Pipeline Stabilization & Traversal Lock) + ADR-TRAV-FSM (FSM Ownership)."
nodes:
  SpatialFactory:
    type: service
    layer: Application
    label: "Spatial Factory (Single Entry Point)"
    description: "ADR-TZ04-4 (B3): Единственная точка входа для сборки SpatialService. Прямые вызовы SpatialService.build_for_location() запрещены."
  SpatialService:
    type: service
    layer: Domain
    label: "Spatial Query Service v1.2"
    description: "Единственный авторитет пространственного графа и узлов. S90: Хранит rooms_geometry и предоставляет is_point_in_bounds(x,y) для ETKE-IK."
  SpatialQueryService:
    type: service
    layer: Domain
    label: "Spatial Query Service (Read Authority)"
    description: "ADR-048: Единственный авторитетный источник чтения дистанций и позиций для бизнес-логики. Чтение scene_state['player_distances'] ЗАПРЕЩЕНО."
  MovementEngine:
    type: service
    layer: Application
    label: "Movement Engine"
  SceneStateManager:
    type: service
    layer: Application
    label: "Scene State Manager (Projection Engine)"
    description: "ADR-130.1: Блокирует перезапись активных транзитов (status=MOVING). ADR-130.2: Обрабатывает cause=traversal_complete как проекцию local_position (snap), не создавая новый маршрут. ADR-TRAV-FSM: Единственный владелец lifecycle перемещений (transition_traversal)."
  LifeEngine:
    type: service
    layer: Application
    label: "Life Engine"
    description: "S85.1: Резолвит цели через SpatialService.resolve_node(role=NodeRole). ADR-154: _simulate_major блокирует генерацию интентов для NPC со статусом MOVING."
  TraversalDict:
    type: domain
    layer: Domain
    label: "Traversal Dict (LOD1)"
    description: "Runtime dict представляющий активные перемещения. SSM владеет lifecycle через FSM. TraversalState dataclass удалён (ADR-TRAV-FSM)."
  SceneChange:
    type: dto
    layer: Domain
    label: "SceneChange (Projection)"
    description: "Проекция свершившегося. Не является командой. ADR-130.2: При cause=traversal_complete выступает фактом завершения движения, а не запросом на новый маршрут. ADR-TZ04-5 (B4-B5): ChangeType.NPC_METADATA (activity, initiative_suppression) и SCENE_METADATA (line_of_sight) добавлены для маршрутизации мутаций."
  MacroMovementGoal:
    type: dto
    layer: Domain
    label: "Macro Movement Goal (LOD1)"
    description: "ADR-060: Объединяет LOD0 и LOD1. ADR-O-137: Включает поле IntentDomain (SURVIVAL/SOCIAL/ROUTINE/EXPLORATION)."
    # --- ETKE-IK v1: MOTION CORE (L0) ---
  AffordanceVector:
    type: domain
    layer: Domain
    label: "Affordance Vector (Field Capabilities)"
    description: "ETKE-IK v1: Физические возможности среды (can_stand, surface_grip, light_level). Заменяет дискретные узлы на непрерывное поле."
  BodySchema:
    type: domain
    layer: Domain
    label: "Body Schema (Kinematic Profile)"
    description: "ETKE-IK v1: Кинематические ограничения тела NPC (max_velocity, acceleration, stamina). Расширяет body_state."
  DriveVector:
    type: dto
    layer: Domain
    label: "Drive Vector (Continuous Movement Intent)"
    description: "ETKE-IK v1: Замена MovementIntent для микро-уровня. Содержит direction (x,y) и intensity (0-1). Тело само ищет путь в поле возможностей."
  KinematicProfile:
    type: dto
    layer: Domain
    label: "Kinematic Profile (Frontend Output)"
    description: "ETKE-IK v1: Выходной профиль движения для фронтенда (velocity, posture, facing, exertion_level). Результат работы SteeringResolver и MotionIntegrator."
  WorldTopologyProvider:
    type: service
    layer: Application
    label: "World Topology Provider (ETKE-IK Gateway)"
    description: "S91: Чистый фасад. Мержит базовую геометрию (SpatialService) с динамическими деформациями (DynamicAffordanceField)."
  DynamicAffordanceField:
    type: service
    layer: Application
    label: "Dynamic Affordance Field (Dual-Layer Stigmergy)"
    description: "S91: State-object с двумя независимыми слоями. 1. Hard Override Layer (структурные деформации, Absolute Override, TTL). 2. Soft Trace Layer (поведенческие следы, накопление, экспоненциальный decay)."
  DeformationRecord:
    type: dto
    layer: Domain
    label: "Deformation Record (Hard Stigmergy DTO)"
    description: "S91: Запись о структурной деформации среды. Хранит причину, силу (Absolute Override), время жизни (TTL) и источник. Используется Hard Override Layer."
  TracePayload:
    type: dto
    layer: Domain
    label: "Trace Payload (Soft Stigmergy DTO)"
    description: "S91: Эмиттер поведенческого следа. Генерируется при движении или насилии. Накапливается в Soft Trace Layer (accumulated float)."
  MotionPrimitive:
    type: domain
    layer: Domain
    label: "Motion Primitive (Enum)"
    description: "S91: Семантический примитив движения (APPROACH, FLEE, RETREAT, SOCIAL_DRIFT). SOCIAL_DRIFT заменяет PATROL для социально оправданного микро-перемещения. Сохраняется в DriveVector."
  CollisionAvoidance:
    type: service
    layer: Application
    label: "Collision Avoidance (Reactive Layer)"
    description: "S90: Реактивная коррекция DriveVector. Проверяет Affordance впереди движения и смещает вектор перпендикулярно при can_pass < 0.5."
  SteeringResolver:
    type: service
    layer: Application
    label: "Steering Resolver (ETKE-IK)"
    description: "ETKE-IK v1: Вычисляет скорость (velocity) из DriveVector с учетом Affordance и BodySchema."
  MotionIntegrator:
    type: service
    layer: Application
    label: "Motion Integrator (ETKE-IK)"
    description: "ETKE-IK v1: Интегрирует скорость в позицию (position += v*dt). Вычисляет усталость."
  GraphCompiler:
    type: service
    layer: Infrastructure
    label: "Graph Compiler (v2 - List format + Adjacency + Boundary + Geometry)"
    description: "S90: Извлекает rooms_geometry (polygons) и передаёт 5-м элементом в compile_graph."
  RoomsGeometry:
    type: dto
    layer: Domain
    label: "Rooms Geometry (Polygons)"
    description: "S90: Физическая геометрия комнат (Dict[room_id, List[Tuple[x,y]]]). Хранится в SpatialService."
  AdjacencyInference:
    type: service
    layer: Domain
    label: "Adjacency Inference"
    description: "Выводит связи из смежности полигонов (ADR-073)"
  EditorJSON:
    type: database
    layer: Infrastructure
    label: "Map Editor JSON (rooms as list)"
  BuiltinFallback:
    type: dto
    layer: Infrastructure
    label: "Builtin Fallback Graph"
  SpatialRuntime:
    type: service
    layer: Domain
    label: "Spatial Runtime (LOS, Sound, Scene Extraction)"
    description: "ADR-102: Использует SpatialService вместо мёртвого load_graph(). ADR-129: normalize_scene_state() — firewall против type corruption."
  LocationGraph:
    type: dto
    layer: Domain
    label: "LocationGraph (DEPRECATED — ADR-102)"
    description: "Легаси load_graph() возвращает пустой граф. Заменён на SpatialService."
  BoundaryNode:
    type: domain
    layer: Domain
    label: "Boundary Node (exit_{direction})"
    description: "ДОЛГ 6.2 (ADR-145): Виртуальный узел на границе чанка. Создаётся из adjacency. NodeRole.BOUNDARY. НЕ является местом — только интерфейс перехода."
  BoundaryMap:
    type: dto
    layer: Domain
    label: "boundary_map (Dict[str, dict])"
    description: "ДОЛГ 6.2 (ADR-145): 4-й элемент возврата compile_graph. SpatialService хранит и предоставляет через is_boundary_node/get_boundary_info."
  SemanticIndex:
    type: service
    layer: Domain
    label: "Semantic Index Layer"
    description: "ADR-301: Разделяет интерпретацию строки от физического разрешения узла. Возвращает List[Candidate]."
  EventCompiler:
    type: service
    layer: Application
    label: "Event Compiler (Physics Generator)"
    description: "ADR-O-201: Компилирует физические события. ADR-O-201.1: Принудительно устанавливает is_boundary=True при наличии target_loc. ADR-O-201.3: Использует (0.0, 0.0) fallback вместо None для target_xy."
  BoundaryRouter:
    type: service
    layer: Application
    label: "Boundary Router"
    description: "S91.1: Перехватывает кросс-локационные MacroMovementGoal и перенаправляет на boundary node текущей локации. (Логика внутри MovementEngine)"
  EquivalenceValidator:
    type: service
    layer: Application
    label: "Equivalence Validator"
    description: "ADR-O-201.2: validate_topology отключен для кросс-локационных переходов, так как узлы физически разные (exit_east vs exit_west)."

edges:
  - from: DriveVector
    to: SteeringResolver
    label: "resolve(drive, body, affordance)"
  - from: SteeringResolver
    to: KinematicProfile
    label: "produces velocity"
  - from: KinematicProfile
    to: MotionIntegrator
    label: "integrate(position, velocity)"
  - from: MotionIntegrator
    to: KinematicProfile
    label: "updates position & exertion"
  - from: SpatialService
    to: WorldTopologyProvider
    label: "get_zone_id(x, y) & geometry"
    condition: "S91: Возвращает zone_id для кэширования деформаций и базовую геометрию."
  - from: WorldTopologyProvider
    to: AffordanceVector
    label: "query_affordance_field(region, pos)"
    condition: "S91: Мержит базовую геометрию, Hard Overrides и Soft Traces."
  - from: TickOrchestrator
    to: DynamicAffordanceField
    label: "owns instance (S91)"
    condition: "Персистентный стигмергический слой. Переживает тики."
    edge_type: dotted
  - from: DynamicAffordanceField
    to: WorldTopologyProvider
    label: "injected via constructor"
    condition: "S91: Провайдер мержит деформации и следы с базовой геометрией."
    edge_type: dotted
  - from: TickOrchestrator
    to: DynamicAffordanceField
    label: "purge_hard_overrides(current_tick)"
    condition: "S91: Очистка истекших структурных деформаций в Фазе 0.5."
  - from: TickOrchestrator
    to: DynamicAffordanceField
    label: "step_decay()"
    condition: "S91: Экспоненциальный decay поведенческих следов в Фазе 0.5."
  - from: DynamicAffordanceField
    to: DeformationRecord
    label: "stores & queries (Hard Layer)"
    condition: "S91: Хранит DeformationRecord по ключу (region, zone_id, deformation_type)."
  - from: DynamicAffordanceField
    to: TracePayload
    label: "accumulates (Soft Layer)"
    condition: "S91: Накапливает TracePayload.magnitude по ключу (region, zone_id, trace_type)."
  - from: TickOrchestrator
    to: DynamicAffordanceField
    label: "apply_trace(TracePayload)"
    condition: "S91: Эмит стигмергических следов (movement_density, safety_confidence)."
  - from: EditorJSON
    to: GraphCompiler
    label: "load_editor_json"
    condition: "Parses rooms array & polygons"
    code_ref: "graph_compiler.py"
  - from: BuiltinFallback
    to: GraphCompiler
    label: "fallback graph"
    condition: "BREAK-2: JSON NOT FOUND -> Builtin"
    code_ref: "graph_compiler.py"
  - from: SpatialRuntime
    to: SpatialService
    label: "resolve_distance + extract_scene (ADR-102)"
    condition: "Требует campaign_id в scene_state. Fallback на euclidean_distance если SpatialService=None"
    code_ref: "spatial_runtime.py:98"
  - from: SceneStateManager
    to: SpatialRuntime
    label: "enriches scene_state with campaign_id (ADR-102)"
    condition: "Инжект campaign_id для SpatialService.build_for_location()"
    code_ref: "scene_state_manager.py:272"
    edge_type: dotted
  - from: GraphCompiler
    to: AdjacencyInference
    label: "triggers if passages empty"
    condition: "If no explicit passages provided"
    adr_ref: "ADR-073"
  - from: AdjacencyInference
    to: GraphCompiler
    label: "returns inferred passages"
    condition: "Based on polygon bounding box intersection"
    adr_ref: "ADR-073"
  - from: GraphCompiler
    to: SpatialService
    label: "compiles graph + boundary_map + rooms_geometry"
    condition: "S90: Возвращает 5 элементов (nodes, edges, alias_map, boundary_map, rooms_geometry)"
    code_ref: "spatial_service.py"
  - from: SpatialService
    to: WorldTopologyProvider
    label: "get_zone_id(x, y) & is_point_in_bounds(x, y)"
    condition: "S91: Возвращает zone_id для кэширования деформаций и bool для базовой проверки."
  - from: TickOrchestrator
    to: DynamicAffordanceField
    label: "owns instance (S91)"
    condition: "Персистентный стигмергический слой. Переживает тики."
    edge_type: dotted
  - from: DynamicAffordanceField
    to: WorldTopologyProvider
    label: "injected via constructor"
    condition: "S91: Провайдер мержит деформации с базовой геометрией."
    edge_type: dotted
  - from: WorldTopologyProvider
    to: DynamicAffordanceField
    label: "apply_deformation(region, zone_id, record)"
    condition: "S91: Делегирует применение деформации в State-object."
  - from: TickOrchestrator
    to: DynamicAffordanceField
    label: "purge_expired(current_tick)"
    condition: "S91: Очистка истекших деформаций в Фазе 0.5 (Temporalization Layer)."
  - from: DynamicAffordanceField
    to: DeformationRecord
    label: "stores & queries"
    condition: "S91: Хранит DeformationRecord по ключу (region, zone_id, deformation_type)."
  - from: LifeEngine
    to: DriveVector
    label: "generates with MotionPrimitive"
    condition: "S90: LifeEngine добавляет 4-й элемент (primitive) в drive_vector list на основе affective_load."
  - from: DriveVector
    to: CollisionAvoidance
    label: "apply(drive, pos, topology)"
    condition: "S90: Проверка геометрии впереди. Возвращает скорректированный DriveVector."
  - from: SpatialService
    to: SpatialQueryService
    label: "provides read-only spatial API"
    condition: "O(1) queries for positions, LOS, distances"
    adr_ref: "ADR-048"
  - from: SpatialQueryService
    to: MovementEngine
    label: "reads graph & positions"
    condition: "O(1) spatial index"
    code_ref: "spatial_query_service.py"
    adr_ref: "ADR-048"
  - from: SpatialService
    to: MovementEngine
    label: "get_node(target_id)"
    condition: "Direct access for node resolution"
    code_ref: "spatial_service.py"
  - from: LifeEngine
    to: SpatialService
    label: "resolve_node(role=NodeRole) (S85.1)"
    condition: "Activity -> _ACTIVITY_TO_ROLE_MAP -> resolve_node(role, origin_zone)"
    adr_ref: "ADR-S85.1"
    code_ref: "life_engine.py"
  - from: SemanticIndex
    to: SpatialService
    label: "resolves semantic targets to canonical IDs"
    condition: "Returns List[Candidate] with scoring"
    adr_ref: "ADR-301"
  - from: DecisionHub
    to: MacroMovementGoal
    label: "produces domain-typed movement goal"
    condition: "Goal contains IntentDomain for viability mask"
    adr_ref: "ADR-O-137"
  - from: MovementEngine
    to: SceneChange
    label: "produces"
    condition: "Only if get_node() != None"
    code_ref: "movement_engine.py"
    adr_ref: "ADR-052"
  - from: SceneChange
    to: SceneStateManager
    label: "applied by"
  - from: SceneStateManager
    to: TraversalDict
    label: "enriches, interpolates & transitions"
    condition: "Uses transition_traversal() for FSM (PENDING->MOVING->COMPLETED). ADR-130.2: On traversal_complete snaps position, does NOT create new traversal."
    code_ref: "scene_state_manager.py:1145,1585"
    adr_ref: "ADR-TRAV-FSM, ADR-130.2"
  - from: EventCompiler
    to: BoundaryNode
    label: "resolves boundary transitions at compile time"
    condition: "Uses frozen snapshot, NOT live SpatialService. ADR-O-201"
    code_ref: "event_compiler.py"
constraints:
  - source: MovementEngine
    target: SceneState
    rule: "FORBIDDEN: Direct mutation (ADR-066)"
    code_ref: "ADR-066"
  - source: GraphCompiler
    target: SpatialService
    rule: "FORBIDDEN: Добавлять orphan rooms в навигационный граф при наличии nodes (жёсткая двухслойная топология ADR-121)"
    code_ref: "S91.1"
  - source: MovementEngine
    target: SceneChange
    rule: "FORBIDDEN: Генерировать кросс-локационный SceneChange напрямую, минуя boundary node (ДОЛГ 6.2)"
    code_ref: "S91.1"
  - source: SceneStateManager
    target: SpatialService
    rule: "FORBIDDEN: Mutate graph"
    code_ref: "ADR-008"
  - source: Enrichment
    target: LOD0_Position
    rule: "FORBIDDEN: Overwrite pipeline position (ADR-072)"
    condition: "If position already valid, skip"
    code_ref: "ADR-072"
  - source: GraphCompiler
    target: EditorJSON
    rule: "FORBIDDEN: Require manual passages if polygons are adjacent (ADR-073)"
    condition: "Must use Adjacency Inference"
    code_ref: "ADR-073"
  - source: SpatialService
    target: TickContext
    rule: "FORBIDDEN: Use location_id as campaign_id (ADR-089)"
    condition: "Campaign ID must be authentic"
    code_ref: "tick_orchestrator.py"
  - source: TickOrchestrator
    target: SpatialService
    rule: "FORBIDDEN: Emergency build_for_location when self._spatial_service already resolved (ADR-065)"
    code_ref: "tick_orchestrator.py:225-232"
    adr_ref: "ADR-065"
  - source: GraphCompiler
    target: EditorJSON
    rule: "FORBIDDEN: Use room x,y as node coordinates (must use centroid x+w/2, y+h/2)"
    code_ref: "graph_compiler.py:108-115"
    adr_ref: "ADR-095"
  - source: GameScreen
    target: WorldSnapshotDTO
    rule: "FORBIDDEN: Overwrite local_position for NPC in MOVING status (ADR-096)"
    code_ref: "game_screen.py:794-799"
    adr_ref: "ADR-096"
  - source: GraphCompiler
    target: LegacyName
    rule: "REQUIRED: Role-based legacy aliases in alias_map (ADR-114)"
  - source: WorldTopologyProvider
    target: AffordanceVector
    rule: "REQUIRED: Non-uniform field. MUST query is_point_in_bounds. (S90 Audit)"
    severity: CRITICAL
  - source: CollisionAvoidance
    target: DriveVector
    rule: "REQUIRED: MUST execute before SteeringResolver. Modifies direction/intensity based on geometry. (S90 Audit)"
    severity: HIGH
  - source: LifeEngine
    target: DriveVector
    rule: "REQUIRED: drive_vector list MUST contain 4 elements [dx, dy, intensity, primitive_str]. (S90 Audit)"
    severity: HIGH
  - source: Frontend
    target: WorldSnapshotDTO
    rule: "REQUIRED: MotionRenderRouter. MUST check velocity first (ETKE-IK), then path_waypoints (FSM). (S90 Audit)"
    severity: CRITICAL
  - source: EventCompiler
    target: SpatialService
    rule: "FORBIDDEN: Node lookup in snapshot.spatial_service for cross-location SceneChange (S88 БАГ S)"
    code_ref: "event_compiler.py:168-173"
    severity: CRITICAL
  - source: EventCompiler
    target: SceneChange
    rule: "REQUIRED: boundary_snap fallback uses change.value and change.target_local_xy when node=None (S88 БАГ S)"
    code_ref: "event_compiler.py:231-234"
    severity: HIGH
  - source: TickOrchestrator
    target: SpatialService
    rule: "REQUIRED: SpatialService per-location scope — get_node() cannot resolve cross-location nodes (S88)"
    code_ref: "spatial_service.py:117-129"
    severity: HIGH
  - source: DataManager
    target: EditorJSON
    rule: "REQUIRED: Map editor nodes added via DataManager.add_node() — NOT manual JSON editing (S88 БАГ N)"
    code_ref: "data_manager.py:847-858, graph_compiler.py:134-153"
    adr_ref: "ADR-114"
    severity: HIGH
  - source: SpatialQueryService
    target: SpatialRuntime
    rule: "FORBIDDEN: Wrong argument order in is_line_of_sight_clear call (ADR-129)"
    code_ref: "spatial_query_service.py:68"
    adr_ref: "ADR-129"
    severity: CRITICAL
  - source: SceneStateManager
    target: SpatialRuntime
    rule: "FORBIDDEN: CEI-2 uses is_movement_blocked instead of is_blocked_by_wall (ADR-129)"
    code_ref: "scene_state_manager.py:1276"
    adr_ref: "ADR-129"
    severity: HIGH
  - source: SpatialRuntime
    target: SceneState
    rule: "REQUIRED: normalize_scene_state() on every consumer function (ADR-129)"
    code_ref: "spatial_runtime.py"
    adr_ref: "ADR-129"
    severity: HIGH
  - source: SceneStateManager
    target: SceneState
    rule: "REQUIRED: isinstance(scene, dict) guard in get_scene_state and get_scene_state_uncached (ADR-129)"
    code_ref: "scene_state_manager.py:255,319"
    adr_ref: "ADR-129"
    severity: HIGH
  - source: TickOrchestrator
    target: MovementEngine
    rule: "REQUIRED: DRF scoring overlay applied to movement intents in BOTH idle and player paths (ADR-135)"
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-135"
    severity: HIGH
  - source: MovementEngine
    target: priority_scale
    rule: "FORBIDDEN: Clamp override max(priority, N) at 0.0-1.0 scale (ADR-135)"
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-135"
    severity: HIGH
  - source: BoundaryNode
    target: SpatialService
    rule: "FORBIDDEN: Boundary node as movement goal or dwelling (Rule 108, ADR-145)"
    code_ref: "graph_compiler.py"
    adr_ref: "ADR-145"
    severity: HIGH
  - source: GraphCompiler
    target: BoundaryNode
    rule: "REQUIRED: Create boundary nodes from adjacency (ADR-145)"
    code_ref: "graph_compiler.py"
    adr_ref: "ADR-145"
    severity: HIGH
  - source: EventCompiler
    target: BoundaryResolution
    rule: "REQUIRED: Boundary resolution in EventCompiler, NOT in apply_changes (ADR-O-201)"
    code_ref: "event_compiler.py (NEW)"
    adr_ref: "ADR-O-201"
    severity: CRITICAL
  - source: ProjectionEngine
    target: SpatialService
    rule: "FORBIDDEN: SpatialService.build_for_location() inside Projection Engine (ADR-O-201)"
    code_ref: "scene_state_manager.py:1230"
    adr_ref: "ADR-O-201"
    severity: CRITICAL
  - source: SemanticIndex
    target: Any
    rule: "FORBIDDEN: SemanticIndex returns single canonical_id (Must return List[Candidate])"
    adr_ref: "ADR-301"
    severity: HIGH
  - source: MacroMovementGoal
    target: IntentDomain
    rule: "REQUIRED: MovementIntent MUST have domain field (ADR-O-137)"
    adr_ref: "ADR-O-137"
    severity: HIGH
  - source: LifeEngine
    target: SceneStateManager
    rule: "REQUIRED: Movement Lock — update_routine MUST check scene_state.active_traversals before mutating routine (ADR-130)"
    adr_ref: "ADR-130"
    severity: HIGH
  - source: LifeEngine
    target: _resolve_position
    rule: "FORBIDDEN: Fallback to string nodes like 'common_area' (S85.1)"
    condition: "Must use _ACTIVITY_TO_ROLE_MAP and SpatialService.resolve_node(role=NodeRole)"
    adr_ref: "ADR-S85.1"
    code_ref: "life_engine.py:1633"
    severity: HIGH
  - source: SpatialQueryService
    target: SceneState
    rule: "FORBIDDEN: Read distances or positions directly from scene_state (ADR-048, ADR-TZ04-1)"
    condition: "scene_state['player_distances'] is DEPRECATED. Use SpatialQueryService."
    adr_ref: "ADR-048, ADR-TZ04-1"
    severity: HIGH
  - source: Any
    target: SpatialService
    rule: "FORBIDDEN: Direct SpatialService.build_for_location() call. MUST use SpatialFactory.build_for_campaign() (ADR-TZ04-4)"
    adr_ref: "ADR-TZ04-4"
    severity: CRITICAL
  # --- S85.1 PIPELINE STABILIZATION & ADR-TRAV-FSM CONSTRAINTS ---
  - source: LifeEngine
    target: MovingNPC
    rule: "FORBIDDEN: LifeEngine generating intents for NPC in status MOVING (ADR-154)"
    severity: CRITICAL
  - source: SceneStateManager
    target: ActiveTraversal
    rule: "FORBIDDEN: apply_changes overwriting active traversal with status MOVING (ADR-130.1)"
    severity: CRITICAL
  - source: SceneStateManager
    target: TraversalComplete
    rule: "FORBIDDEN: Creating new traversal_dict for cause=traversal_complete. MUST snap local_position (ADR-130.2, ADR-TRAV-FSM)"
    severity: CRITICAL
  - source: SceneStateManager
    target: TraversalStatus
    rule: "FORBIDDEN: Direct mutation of traversal status (status = ...). MUST use transition_traversal() FSM (ADR-TRAV-FSM)"
    severity: CRITICAL
  - source: WorldSnapshotBuilder
    target: current_waypoint_idx
    rule: "REQUIRED: Must propagate current_waypoint_idx from runtime dict to frontend projection (ADR-TRAV-FSM)"
    severity: HIGH
  - source: EventCompiler
    target: BoundaryFlag
    rule: "REQUIRED: EventCompiler MUST set is_boundary=True when target_loc is present (ADR-O-201.1)"
    severity: CRITICAL
  - source: EventCompiler
    target: NullCoordinate
    rule: "FORBIDDEN: Using None for SpatialResolution.target_xy. MUST use (0.0, 0.0) fallback (ADR-O-201.3)"
    severity: CRITICAL
  - source: EventCompiler
    target: TraversalContract
    rule: "FORBIDDEN: Creating TraversalContract with status=COMPLETED. EventCompiler MUST return traversal=None for cause=traversal_complete and boundary snap. SSM owns lifecycle (ADR-O-201.4, ADR-TRAV-FSM)."
    severity: CRITICAL
  - source: EquivalenceValidator
    target: CrossLocationTopology
    rule: "FORBIDDEN: validate_topology for cross-location transitions. Nodes are physically different (ADR-O-201.2)"
    severity: HIGH
sequences:
  - title: "Broken Traversal Flow (Node Not Found - BREAK-N)"
    participants: [DecisionHub, MovementEngine, SpatialService, SceneStateManager]
    steps:
      - from: DecisionHub
        to: MovementEngine
        message: "1. Intent(FLEE, target=main_hall)"
      - from: MovementEngine
        to: SpatialService
        message: "2. get_node('main_hall')"
      - from: SpatialService
        to: MovementEngine
        message: "3. Return None (Node missing in fallback)"
        type: dotted
      - from: MovementEngine
        to: SceneStateManager
        message: "4. No Traversal created -> coords=None"
        type: dotted
  - title: "Semantic Spatial Binding Flow (ADR-S85.1)"
    participants: [LifeEngine, SpatialService, NodeRef]
    steps:
      - from: LifeEngine
        to: LifeEngine
        message: "1. Get activity (e.g., 'drinking')"
      - from: LifeEngine
        to: LifeEngine
        message: "2. Map to NodeRole.BAR via _ACTIVITY_TO_ROLE_MAP"
      - from: LifeEngine
        to: SpatialService
        message: "3. resolve_node(role=BAR, origin_zone=current_loc)"
      - from: SpatialService
        to: LifeEngine
        message: "4. Return NodeRef (canonical_id, x, y)"
  - title: "Boundary Node Creation Flow (ДОЛГ 6.2, ADR-145)"
    participants: [EditorJSON, GraphCompiler, BoundaryNode, SpatialService]
    steps:
      - from: EditorJSON
        to: GraphCompiler
        message: "1. Load nodes + adjacency (east: city_gate, south: market_square)"
      - from: GraphCompiler
        to: BoundaryNode
        message: "2. _create_boundary_nodes(): exit_east, exit_south"
      - from: BoundaryNode
        to: SpatialService
        message: "3. boundary_map: {exit_east → {neighbor: city_gate, entry_direction: west}}"
      - from: SpatialService
        to: SpatialService
        message: "4. is_boundary_node() / get_boundary_info() for MovementEngine"
  - title: "Adjacency Inference Success Flow (ADR-073)"
    participants: [EditorJSON, GraphCompiler, AdjacencyInference, SpatialService]
    steps:
      - from: EditorJSON
        to: GraphCompiler
        message: "1. Load rooms (as list) with empty passages"
      - from: GraphCompiler
        to: AdjacencyInference
        message: "2. Pass rooms for adjacency check"
      - from: AdjacencyInference
        to: GraphCompiler
        message: "3. Return inferred passages (based on bounding box)"
      - from: GraphCompiler
        to: SpatialService
        message: "4. Compile connected graph"
  - title: "Semantic Target Resolution Flow (ADR-301)"
    participants: [IntentCompressor, SemanticIndex, CandidateScoring, SelectionPolicy, SpatialService]
    steps:
      - from: IntentCompressor
        to: SemanticIndex
        message: "1. Target reference string (e.g., 'тень')"
      - from: SemanticIndex
        to: SemanticIndex
        message: "2. Classify string (CANONICAL/ROLE_ALIAS/FUZZY)"
      - from: SemanticIndex
        to: CandidateScoring
        message: "3. Return List[Candidate]"
      - from: CandidateScoring
        to: SelectionPolicy
        message: "4. Score and select (STRICT_MAX/STABLE/DIVERSE)"
      - from: SelectionPolicy
        to: SpatialService
        message: "5. get_node(canonical_id)"
  - title: "Traversal Complete Snap & FSM Flow (ADR-130.2, ADR-TRAV-FSM)"
    participants: [TickOrchestrator, SceneChange, SceneStateManager, SceneState]
    steps:
      - from: TickOrchestrator
        to: SceneChange
        message: "1. Emits SceneChange(cause='traversal_complete')"
      - from: SceneChange
        to: SceneStateManager
        message: "2. apply_changes receives change"
      - from: SceneStateManager
        to: SceneState
        message: "3. Snaps local_position. Calls transition_traversal(MOVING->COMPLETED). DOES NOT create new traversal."

  # S91.1: Cross-Location Boundary Routing
  - from: MovementEngine
    to: MovementEngine
    label: "Cross-Loc Intercept"
    condition: "target_loc != current_loc → reroute to boundary"
  - from: MovementEngine
    to: SpatialService
    label: "get_boundary_to_neighbor"
    condition: "neighbor_loc"
  - from: SpatialService
    to: MovementEngine
    label: "NodeRef"
    condition: "exit_east/west/etc."
  - from: MovementEngine
    to: SceneChange
    label: "Reroute to Boundary"
    condition: "field=position, value=boundary_node_id"