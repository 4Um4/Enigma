ownership:
  DeltaBuffer:
    owner: "TickOrchestrator"
    creates: "Various services via event_bus.publish"
    modifies: "StateApplicator (apply_batch)"
    reads: "StateApplicator"
    constraint: "ALL state mutations MUST go through DeltaBuffer. Direct mutation = architectural violation (ADR-001)."
  TickContext:
    owner: "TickOrchestrator"
    creates: "TickOrchestrator"
    modifies: "TickOrchestrator"
    reads: "SpatialService, MovementEngine"
  PipelineContext:
    owner: "TickOrchestrator"
    creates: "context_builder"
    modifies: "TickOrchestrator (writes player_perception)"
    reads: "DMAgent, NPC orchestration"
  WorldSnapshotDTO:
    owner: "WorldSnapshotBuilder"
    creates: "WorldSnapshotBuilder (immutable projection)"
    modifies: "N/A"
    reads: "APIRoutes → Frontend"
    constraint: "Snapshot is a PROJECTION, not state. Must not be written back."
  EmbodiedTraceDTO:
    owner: "BehaviorManifestationService"
    creates: "BehaviorManifestationService"
    modifies: "N/A (immutable)"
    reads: "PhenomenologyProjectionService"
    constraint: "Rule X: only body_state inputs. No psyche. No emotions."
  PlayerPerceptionDTO:
    owner: "PhenomenologyProjectionService"
    creates: "PhenomenologyProjectionService"
    modifies: "N/A (immutable)"
    reads: "WorldSnapshotBuilder"
  LLMResponse:
    owner: "llama_cpp_provider"
    creates: "llama_cpp_provider (_complete_via_server / stream_complete)"
    modifies: "N/A"
    reads: "agent_runner → __init__.py → DM Agent"
    constraint: "3 retries with backoff. Partial stream recovery (>20 chars). On permanent failure: honest error dict, no fake narrative."
    adr_ref: "ADR-113"
  NPCStateAdapter_RoundTrip:
    owner: "StateApplicator (calls from_legacy + write_to_legacy)"
    creates: "from_legacy creates NPCState from dict"
    modifies: "write_to_legacy writes NPCState back to dict"
    reads: "All downstream consumers of npc_dict"
    constraint: "CRITICAL: Core fields in NPCState MUST have both read and write. Missing ANY = silent reset. Fields: npc_id, body_state, perceptual_kernel (11 sub-fields incl. somatic_urgency), emotion, affective_load, trauma_markers, stress, will_state, narrative_cache, causal_ledger. relationship_cache is NOT round-tripped (ADR-121)."
    adr_ref: "ADR-115, ADR-116, ADR-117, ADR-138"
  LifeEngine_Cache:
    owner: "LifeEngine"
    creates: "LifeEngine.tick() or load_npcs_merged() or persistence.load_npc_runtime()"
    modifies: "update_cache() after apply_batch"
    reads: "get_npc_states(), _load_npcs_with_runtime(), _load_npcs() with SQLite read-back"
    constraint: "CRITICAL: After apply_batch mutates npc_dict, LifeEngine._npc_cache MUST be updated. GameLoop._load_npcs_with_runtime MUST check cache before loading from file. ADR-128: On cache miss, _load_npcs() MUST try SQLite read-back (COLD-1) before static config (COLD-2)."
    adr_ref: "ADR-117, ADR-128"
  AffectivePipeline_PlayerTurn:
    owner: "TickOrchestrator (_phase_9_player_integration)"
    creates: "_run_affective_pipeline(ctx)"
    modifies: "DeltaBuffer (EmotionPayload)"
    reads: "ctx.all_npcs_raw (npc_raw.affective_load, emotion, perceptual_kernel, drives, psyche)"
    constraint: "MUST run in BOTH idle and player turn paths."
    adr_ref: "ADR-117"
  MovementLock:
    owner: "LifeEngine (update_routine)"
    creates: "None (guard only)"
    modifies: "None (prevents state mutation)"
    reads: "scene_state.active_traversals[npc_id].status"
    constraint: "CRITICAL: If NPC has active traversal with status=MOVING, update_routine MUST return early."
    adr_ref: "ADR-130"
  TargetResolution:
    owner: "DecisionHub (_context_relevance)"
    creates: "is_targeted bool for utility scoring"
    modifies: "APPROACH/TALK/OBSERVE scores"
    reads: "EventContext.target_id, EventContext.payload['target_id']"
    constraint: "CRITICAL: _context_relevance MUST check EventContext.payload['target_id'] as fallback."
    adr_ref: "ADR-130"
  SnapshotKernel:
    owner: "TickOrchestrator (creates per tick)"
    creates: "WorldSnapshot from scene_state + spatial_graph + npc_states"
    modifies: "N/A (immutable after creation)"
    reads: "EventCompiler (sole consumer)"
    constraint: "CRITICAL: Snapshot = frozen reality for tick t. No live objects, no services, no runtime references."
    adr_ref: "ADR-O-201"
  EventCompiler:
    owner: "TickOrchestrator (owns lifecycle)"
    creates: "ThickSceneChange[] from Snapshot + Intents"
    modifies: "N/A (does not touch world state)"
    reads: "SnapshotKernel (frozen), NPC Intents, Player Input"
    constraint: "CRITICAL: ONLY place where pathfinding, boundary logic, RNG, geometry computation exist. Deterministic given same snapshot + seed."
    adr_ref: "ADR-O-201"
  ThickSceneChange:
    owner: "EventCompiler (creates)"
    creates: "EventCompiler.compile(snapshot)"
    modifies: "N/A (immutable after creation)"
    reads: "ProjectionEngine (applies), EquivalenceValidator (validates)"
    constraint: "CRITICAL: Must contain complete SpatialResolution, MotionPlan, BoundaryResolution."
    adr_ref: "ADR-O-201"
  EquivalenceValidator:
    owner: "TickOrchestrator (invokes per tick via _validate_shadow_vs_legacy)"
    creates: "DriftReport[]"
    modifies: "N/A (observation only)"
    reads: "SceneChange (legacy), ThickSceneChange (shadow), scene_state, active_traversals"
    constraint: "CRITICAL: 4 validate methods. 5 drift classes. DEPRECATION layer maps drift class+field → Rule number. Takeover criteria: 0 C/D/E drift over 100k+ comparisons."
    adr_ref: "ADR-O-201"
  ProjectionEngine:
    owner: "SceneStateManager (apply_change refactored)"
    creates: "State mutations (dict assignments only)"
    modifies: "scene_state (via ThickSceneChange application)"
    reads: "ThickSceneChange (complete physical contract)"
    constraint: "CRITICAL: Pure projection function. FORBIDDEN: pathfinding, spatial queries, RNG, decision making."
    adr_ref: "ADR-O-201"
  ActionEligibilityGate:
    owner: "GameLoop (run_turn)"
    creates: "Early return ChatTurnResponse if player DEAD"
    modifies: "None (prevents pipeline execution)"
    reads: "_avatar_state.body_state['life_status']"
    constraint: "CRITICAL: Player action MUST NOT be processed if life_status='DEAD'."
    adr_ref: "ADR-131, ADR-137"
  AvatarStateDTO_Pipeline:
    owner: "AvatarPresentationAssembler"
    creates: "AvatarStateDTO from player_dict (body_state + psyche)"
    modifies: "N/A (immutable frozen dataclass)"
    reads: "WorldSnapshotBuilder → APIRoutes → Frontend (GameScreen)"
    constraint: "Assembler is PROJECTION BOUNDARY (L0→Presentation). life_status passed through for death feedback. DEAD override zeros ALL projections."
    adr_ref: "ADR-137, ADR-094"
  PressureTranslator_Pipeline:
    owner: "PressureTranslator"
    creates: "DecisionContext (feasibility constraints) from PerceptualKernel + body_state"
    modifies: "N/A (pure function)"
    reads: "DecisionHub (translate_kernel_to_context)"
    constraint: "CRITICAL: pain MUST be normalized /100.0 before threshold comparison."
    adr_ref: "ADR-094, GAP3"
  DRFBus_Ownership:
    owner: "TickOrchestrator (self._drf_bus)"
    creates: "TickOrchestrator.__init__() — single instance per orchestrator"
    modifies: "Claims written by pipeline phases, drained by persistence"
    reads: "_apply_drf_scoring_overlay(), _phase_10_persistence()"
    constraint: "CRITICAL: DRFBus MUST live on TickOrchestrator instance, NOT in _TickContext default_factory."
    adr_ref: "ADR-134"
  DRFExecutionContext_Ownership:
    owner: "TickOrchestrator (creates root drf_ctx)"
    creates: "DRFExecutionContext(tick_id, bus) at start of tick"
    modifies: "Scoped per NPC via for_npc(npc_id)"
    reads: "npc_tick_pipeline (receives drf_ctx, emits claims via drf_ctx.emit())"
    constraint: "Pipeline receives drf_ctx, not bare drf_bus. Monkey-patching function.drf_bus = ... is FORBIDDEN."
    adr_ref: "ADR-136"
  PhysiologyScaleContract:
    owner: "StateApplicator (writes body_state as SSOT)"
    creates: "body_state dict with pain/fatigue 0-100, blood_loss/shock_impulse 0-1"
    modifies: "StateApplicator.apply_batch()"
    reads: "ALL body_state consumers"
    constraint: "CONTRACT: body_state['pain'] and body_state['fatigue'] stored in 0-100 scale. Consumers with 0-1 thresholds MUST normalize pain/fatigue /100.0."
    adr_ref: "ADR-094"
  ArousalGate_BehaviorTransition:
    owner: "LifeEngine (_arousal_gate method)"
    creates: "SceneChange(field='activity', value='', cause='arousal_gate')"
    modifies: "routine['current'] → '' (clears sleeping/resting)"
    reads: "PerceptualKernel, body_state (pain, fatigue)"
    constraint: "ADR-O-142A: Arousal Gate = behavior transition gate, NOT consciousness transition. FORBIDDEN: 'awake' as activity value. FORBIDDEN: Wake when initiative_suppression > 0.7."
    adr_ref: "ADR-O-142A"
  # --- IDENTITY OWNERSHIP ---
  L1Chronicle_Ownership:
    owner: "NPCState / npc_tick_pipeline"
    creates: "TraitDriftEvent on world pressure"
    modifies: "Append-only. FORBIDDEN: Deletion."
    reads: "DriveResolver (query_weighted)"
    constraint: "CRITICAL: Append-only history of identity deformation. Deletion = rewriting history (ADR-O-208)."
    adr_ref: "ADR-O-208"
  DriveResolver_Ownership:
    owner: "TickOrchestrator / LifeEngine"
    creates: "EffectiveDrives (L3 projection)"
    modifies: "N/A (pure function)"
    reads: "L1Chronicle, Archetype (Base Drives L0)"
    constraint: "CRITICAL: MUST be recalculated every tick. EffectiveDrives is ephemeral L3-P1. Caching = stale identity (ADR-O-208)."
    adr_ref: "ADR-O-208"
  OntologyGuard:
    owner: "StateApplicator"
    creates: "OntologyViolationError"
    modifies: "Kills tick (Runtime Crash)"
    reads: "NPCState.drives_base, EffectiveDrives.values"
    constraint: "CRITICAL: Checks bounds [0,1], NaN, sum(drives)==1.0. Violation = invalid reality state. Must kill tick to prevent persistence of corrupted ontology (ADR-O-207)."
    adr_ref: "ADR-O-207"
  DriftLaboratory:
    owner: "EquivalenceValidator (validates)"
    creates: "DriftResult (stress test reports)"
    modifies: "N/A (read-only runtime snapshot)"
    reads: "TickOrchestrator, SceneStateManager, EventCompiler"
    layer: "Validation (SUPERBOX)"
    constraint: "Stress-tests Dual Rail pipeline (ADR-O-201). Validates Class A-E drift accumulation and Phase 3 readiness. Uses real production code, not mocks."
    adr_ref: "ADR-O-201"
    path: "backend/tests/sandbox/SUPERBOX/drift_laboratory.py"
    suites: ["mass_traversal", "save_load_storm", "chunk_migration", "long_horizon"]
sequences:
  - title: "Pipeline Tick Execution Flow"
    participants: [TickOrchestrator, LifeEngine, DeltaBuffer, StateApplicator, SQLiteDB]
    steps:
      - from: TickOrchestrator
        to: LifeEngine
        message: "1. Run tick_decisions()"
      - from: LifeEngine
        to: DeltaBuffer
        message: "2. Push StateDeltas"
        type: dotted
      - from: TickOrchestrator
        to: DeltaBuffer
        message: "3. Push Phase 8 deltas"
        type: dotted
      - from: TickOrchestrator
        to: StateApplicator
        message: "4. Trigger apply_batch()"
      - from: StateApplicator
        to: SQLiteDB
        message: "5. Atomic commit"
  - title: "Player Death Feedback Flow (ADR-137)"
    participants: [GameLoop, AvatarPresentationAssembler, AvatarStateDTO, WorldSnapshotBuilder, APIRoutes, GameScreen]
    steps:
      - from: GameLoop
        to: GameLoop
        message: "1. load_state() → check body_state['life_status']"
      - from: GameLoop
        to: AvatarPresentationAssembler
        message: "2. If ALIVE: assemble_avatar_presentation(player_dict)"
      - from: AvatarPresentationAssembler
        to: AvatarStateDTO
        message: "3. AvatarStateDTO(life_status='ALIVE', pain=pain/100.0, ...)"
      - from: AvatarStateDTO
        to: WorldSnapshotBuilder
        message: "4. Embedded in WorldSnapshotDTO.avatar_state"
      - from: WorldSnapshotBuilder
        to: APIRoutes
        message: "5. WorldSnapshotDTO → JSON response"
      - from: APIRoutes
        to: GameScreen
        message: "6. scene_state['avatar_state'] → renderer"
      - from: GameScreen
        to: GameScreen
        message: "7. If life_status='DEAD': render death overlay"
  - title: "Death Guard v2 — World Continues (ADR-137)"
    participants: [GameLoop, LifeEngine, AvatarPresentationAssembler, APIRoutes]
    steps:
      - from: GameLoop
        to: GameLoop
        message: "1. _avatar_state.body_state['life_status'] == 'DEAD'"
      - from: GameLoop
        to: LifeEngine
        message: "2. get_npc_states(campaign_id) — world still lives"
      - from: LifeEngine
        to: GameLoop
        message: "3. Cached npc_dicts"
      - from: GameLoop
        to: AvatarPresentationAssembler
        message: "4. Assemble death avatar (all projections zeroed, life_status=DEAD)"
      - from: GameLoop
        to: APIRoutes
        message: "5. ChatTurnResponse(world_snapshot={avatar_state: death, npc_positions: cached})"
  - title: "ADR-094 MSOC Normalization Flow"
    participants: [StateApplicator, AvatarPresentationAssembler, PressureTranslator, BehaviorManifestationService]
    steps:
      - from: StateApplicator
        to: StateApplicator
        message: "1. Writes body_state: pain=0-100, fatigue=0-100, blood_loss=0-1, shock_impulse=0-1"
      - from: AvatarPresentationAssembler
        to: AvatarPresentationAssembler
        message: "2. pain / 100.0 → 0-1 scale. Thresholds: 0.5=WOUNDED, 0.8=CRIPPLED"
      - from: PressureTranslator
        to: PressureTranslator
        message: "3. pain / 100.0 → 0-1 scale. Somatic Veto: pain>0.8 blocks FLEE"
      - from: BehaviorManifestationService
        to: BehaviorManifestationService
        message: "4. pain raw 0-100. Thresholds: 10/20/50/80. NO normalization — motor layer works in 0-100"
  - title: "DRF Causal Field Flow (ADR-134/136)"
    participants: [TickOrchestrator, DRFBus, DRFExecutionContext, npc_tick_pipeline, MovementEngine]
    steps:
      - from: TickOrchestrator
        to: DRFBus
        message: "1. self._drf_bus.stream.clear() at start of execute()"
      - from: TickOrchestrator
        to: DRFExecutionContext
        message: "2. DRFExecutionContext(tick_id, npc_id, bus)"
      - from: DRFExecutionContext
        to: npc_tick_pipeline
        message: "3. drf_ctx.for_npc(npc_id) — scoped per NPC"
      - from: npc_tick_pipeline
        to: DRFBus
        message: "4. drf_ctx.emit(reason, energy, vector) — claims auto-inherit npc_id"
      - from: TickOrchestrator
        to: TickOrchestrator
        message: "5. _apply_drf_scoring_overlay() — both idle and player paths (ADR-135)"
      - from: TickOrchestrator
        to: MovementEngine
        message: "6. Intents with DRF-adjusted priority → process_intents()"
  - title: "Causal Kernel Pipeline Flow (ADR-O-201)"
    participants: [TickOrchestrator, SnapshotKernel, EventCompiler, ThickSceneChange, ProjectionEngine, WorldState]
    steps:
      - from: TickOrchestrator
        to: SnapshotKernel
        message: "1. Create immutable snapshot(scene_state, spatial_graph, rng_seed)"
      - from: SnapshotKernel
        to: EventCompiler
        message: "2. Frozen snapshot + NPC intents + player input"
      - from: EventCompiler
        to: ThickSceneChange
        message: "3. compile() → List[ThickSceneChange] with full SpatialResolution + MotionPlan + BoundaryResolution"
      - from: ThickSceneChange
        to: ProjectionEngine
        message: "4. Apply complete physical contracts (no computation needed)"
      - from: ProjectionEngine
        to: WorldState
        message: "5. state[t+1] = state[t] ⊕ ThickSceneChange[] (pure dict assignment)"
  - title: "Equivalence Validation Flow (ADR-O-201 ФАЗА 2)"
    participants: [TickOrchestrator, EventCompiler, ThickSceneChange, SceneChange, EquivalenceValidator, DriftReport]
    steps:
      - from: TickOrchestrator
        to: EventCompiler
        message: "1. Shadow compile(snapshot) alongside legacy pipeline"
      - from: EventCompiler
        to: ThickSceneChange
        message: "2. Shadow output (full physical contract)"
      - from: TickOrchestrator
        to: SceneChange
        message: "3. Legacy output (current physics)"
      - from: TickOrchestrator
        to: EquivalenceValidator
        message: "4a-d. validate_position/topology/boundary/traversal"
      - from: EquivalenceValidator
        to: DriftReport
        message: "5. Classify drift (A-E) + DEPRECATION mapping"
      - from: TickOrchestrator
        to: DriftReport
        message: "6. Accumulate stats + phase3 readiness indicator"
  # --- IDENTITY SEQUENCES ---
  - title: "Identity Resolution Flow (ADR-O-208 / ADR-O-304)"
    participants: [WorldPressure, L1Chronicle, DriveResolver, EffectiveDrives, CalibrationEngine, DecisionHub]
    steps:
      - from: WorldPressure
        to: L1Chronicle
        message: "1. Append TraitDriftEvent (trait, delta, source, tick)"
      - from: L1Chronicle
        to: DriveResolver
        message: "2. query_weighted(npc_id, current_tick) → L1 History"
      - from: DriveResolver
        to: EffectiveDrives
        message: "3. resolve_drives(archetype_L0, l1_events) → L3 Projection"
      - from: EffectiveDrives
        to: CalibrationEngine
        message: "4. Pass-through (No scalar mutation, Test C fix)"
      - from: CalibrationEngine
        to: DecisionHub
        message: "5. Deliver L3_stable (Projection-native scoring)"
  - title: "Belief Formation Flow (ADR-O-305)"
    participants: [L1Chronicle, PatternDetector, BeliefCrystallizationEngine, DecisionHub]
    steps:
      - from: L1Chronicle
        to: PatternDetector
        message: "1. Group TraitDriftEvents by source, calculate persistence frequency"
      - from: PatternDetector
        to: BeliefCrystallizationEngine
        message: "2. If frequency > noise_threshold, emit EvidenceOfPersistence(source, trait)"
      - from: BeliefCrystallizationEngine
        to: DecisionHub
        message: "3. Crystallize into Belief (source → policy_shift). Inject via belief_modifiers"
  - title: "Viability Pre-Generation Gate Flow (ADR-O-137)"
    participants: [PerceptualKernel, IntentDomain, LifeEngine, MacroMovementGoal]
    steps:
      - from: PerceptualKernel
        to: IntentDomain
        message: "1. _compute_viability_mask(): threat_gradient > 0.3 → EXCLUDE ROUTINE"
      - from: IntentDomain
        to: LifeEngine
        message: "2. Gate: Call generators ONLY for viable domains"
      - from: LifeEngine
        to: MacroMovementGoal
        message: "3. Generate intent with domain=IntentDomain.SURVIVAL"
      - from: LifeEngine
        to: LifeEngine
        message: "4. FORBIDDEN: Post-generation filtering (zombie causality)"