domain: PIPELINE
description: "Фундамент симуляции и время. Дискретная каузальность, мутации только через DeltaBuffer. Идентичность — поле дрейфа."
nodes:
  TickOrchestrator:
    type: service
    layer: Application
    label: "Tick Orchestrator"
    style: {fill: "#e1f5fe", stroke: "#0277bd", "stroke-width": "4px"}
  LifeEngine:
    type: service
    layer: Application
    label: "Life Engine (De-godified)"
    description: "ADR-154: _simulate_major блокирует генерацию интентов для NPC в статусе MOVING."
  DeltaBuffer:
    type: queue
    layer: Domain
    label: "Delta Buffer (Event Bus)"
  StateApplicator:
    type: service
    layer: Application
    label: "State Applicator"
    description: "ADR-HP-UNIFICATION (S86): body_state['current_hp'] is canonical. Direct write to state.hp forbidden."
  CognitiveOverlay:
    type: service
    layer: Application
    label: "Cognitive Overlay (T+0)"
  SQLiteDB:
    type: database
    layer: Infrastructure
    label: "Runtime SQLite"
  LlamaServer:
    type: external
    layer: Infrastructure
    label: "LLM API (llama-server :8080)"
  TickContext:
    type: dto
    layer: Application
    label: "Tick Context"
  BehaviorManifestationService:
    type: service
    layer: Application
    label: "Behavior Manifestation Service"
  PhenomenologyProjectionService:
    type: service
    layer: Application
    label: "Phenomenology Projection Service"
  WorldSnapshotBuilder:
    type: service
    layer: Application
    label: "World Snapshot Builder"
  EmbodiedTraceDTO:
    type: dto
    layer: Domain
    label: "Embodied Trace DTO"
  PlayerPerceptionDTO:
    type: dto
    layer: Domain
    label: "Player Perception DTO"
  DMAgent:
    type: service
    layer: Application
    label: "DM Agent (Narrative)"
  PipelineContext:
    type: dto
    layer: Application
    label: "Pipeline Context"
  NPCStateAdapter:
    type: service
    layer: Application
    label: "NPCState Adapter (Serialization Bridge)"
    description: "from_legacy / write_to_legacy — единственная точка конвертации dict↔NPCState. ADR-S85.1.1: TickOrchestrator использует NPCStateAdapter, а не NPCState.from_legacy."
    code_ref: "npc_state.py:635-800"
  SqlitePersistenceAdapter:
    type: service
    layer: Infrastructure
    label: "SQLite Persistence Adapter"
  JsonPersistenceAdapter:
    type: service
    layer: Infrastructure
    label: "JSON Persistence Adapter (Legacy)"
  AffectivePipeline:
    type: service
    layer: Application
    label: "Affective Pipeline (_run_affective_pipeline)"
  AffectiveDecayHandler:
    type: service
    layer: Application
    label: "Affective Decay Handler (Phase 0.5)"
  AvatarPresentationAssembler:
    type: service
    layer: Application
    label: "Avatar Presentation Assembler"
  AvatarStateDTO:
    type: dto
    layer: Domain
    label: "Avatar State DTO (Phenomenological Projection)"
  PressureTranslator:
    type: service
    layer: Application
    label: "Pressure Translator (Somatic Veto)"
  DRFBus:
    type: queue
    layer: Application
    label: "DRF Bus (Causal Field Bus)"
  DRFExecutionContext:
    type: dto
    layer: Application
    label: "DRF Execution Context (Scoped Causal Ledger)"
  SnapshotKernel:
    type: dto
    layer: Domain
    label: "WorldSnapshot (Immutable Reality Slice)"
  EventCompiler:
    type: service
    layer: Application
    label: "Event Compiler (Physics Generator)"
    description: "ADR-O-201.1: Принудительно устанавливает is_boundary=True. ADR-O-201.3: Использует (0.0, 0.0) fallback вместо None для target_xy."
  ThickSceneChange:
    type: dto
    layer: Domain
    label: "Thick Scene Change (Full Physical Contract)"
  EquivalenceValidator:
    type: service
    layer: Application
    label: "Equivalence Validator (Drift Detector)"
    description: "ADR-O-201.2: validate_topology отключен для кросс-локационных переходов."
  ProjectionEngine:
    type: service
    layer: Application
    label: "Projection Engine (Pure State Writer)"
    description: "ADR-130.1: Блокирует перезапись активных транзитов. ADR-130.2: Snaps local_position на traversal_complete."
  GameLoop:
    type: service
    layer: Application
    label: "Game Loop (Pipeline Controller)"
  MemoryManager:
    type: service
    layer: Application
    label: "Memory Manager"
    description: "ADR-S86.7: compress_narrative_cache works in idle. check_identity_promotion REQUIRES phase_2_events."
  BehaviorMaskEvaluator:
    type: service
    layer: Application
    label: "Behavior Mask Evaluator"
    description: "S86: Evaluates WillState and relationship_cache to assign COLAPSE/FAKE_SUBMISSION/BETRAYAL masks before DecisionHub."
  # --- IDENTITY LAYER (DOM-10) ---
  L1Chronicle:
    type: domain
    layer: Domain
    label: "L1 Chronicle (Append-Only History)"
    description: "ADR-O-208.1 / ADR-O-208.2 (S86): Backed by SQLite (l1_chronicle_events). In-memory dict is cache only. Uses canonical TraitDriftEvent (target_id, tick_id, effect_value)."
  DriveResolver:
    type: domain
    layer: Domain
    label: "Drive Resolver (Pure Function L0+L1→L3)"
  EffectiveDrives:
    type: dto
    layer: Domain
    label: "Effective Drives (Ephemeral L3 Projection)"
  CalibrationEngine:
    type: service
    layer: Application
    label: "Calibration Engine (Pass-through / Deprecated)"
    status: DEPRECATED
    description: "ADR-O-211 (S86): Pass-through ONLY. Applying ctx.drives_updates to state.drives_runtime is FORBIDDEN to prevent noise accumulation."
  PatternDetector:
    type: service
    layer: Application
    label: "Pattern Detector (L1.5 Source Grouping & Noise Filter)"
    status: VERIFIED
    description: "ADR-O-305A: Комбинированная behavior_variance (дисперсия + временная осцилляция). event_type отсечён."
  EvidenceOfPersistence:
    type: dto
    layer: Domain
    label: "Evidence Of Persistence (L1.5 Aggregate)"
    description: "Чистая статистика. Поля: source_id, cumulative_effect, behavior_variance."
  BeliefCrystallizationEngine:
    type: service
    layer: Application
    label: "Belief Crystallization Engine (L2.5)"
    status: VERIFIED
    description: "ADR-O-305/307: Проекция статистики в CrystallizedBelief. Асимметричная травма (x6) и энтропия (Decay)."
  CrystallizedBelief:
    type: dto
    layer: Domain
    label: "Crystallized Belief (L2.5 Projection)"
    description: "Поля: source_id, trait, weight, last_updated_tick. Подвержен энтропии."
  CrystallizedBeliefStore:
    type: service
    layer: Application
    label: "Crystallized Belief Store (L2.5 Storage)"
    status: VERIFIED
  CrystallizedBeliefModifierResolver:
    type: service
    layer: Application
    label: "Crystallized Belief Modifier Resolver (L2.5 -> Drive Modifiers)"
    status: VERIFIED
  OntologyViolationError:
    type: domain
    layer: Domain
    label: "Ontology Violation Error (L5 Post-Commit Guard)"
  IntentDomain:
    type: domain
    layer: Domain
    label: "Intent Domain (SURVIVAL/SOCIAL/ROUTINE/EXPLORATION)"
  BreakProgressEngine:
    type: service
    layer: Application
    label: "Break Progress Engine"
    description: "S86: Fully wired into _phase_5_decision. Generates canonical TraitDriftEvent (target_id, effect_value)."
edges:
  - from: LifeEngine
    to: DeltaBuffer
    label: "emits intents & deltas"
    edge_type: thick
  - from: TickOrchestrator
    to: DeltaBuffer
    label: "aggregates Phase 8 results"
  - from: DeltaBuffer
    to: StateApplicator
    label: "apply_batch()"
    edge_type: thick
  - from: CognitiveOverlay
    to: StateApplicator
    label: "injects shock_impulse > 0.5"
    edge_type: dotted
  - from: StateApplicator
    to: SQLiteDB
    label: "commits state"
  - from: StateApplicator
    to: BehaviorManifestationService
    label: "reads npc_positions (body_state only)"
  - from: BehaviorManifestationService
    to: PhenomenologyProjectionService
    label: "EmbodiedTraceDTO"
  - from: PhenomenologyProjectionService
    to: WorldSnapshotBuilder
    label: "Domain PlayerPerceptionDTO"
  - from: WorldSnapshotBuilder
    to: APIRoutes
    label: "Canonical PlayerPerceptionDTO"
  - from: TickOrchestrator
    to: LlamaServer
    label: "query LLM (3 retries)"
    edge_type: dotted
  - from: GameScreen
    to: APIRoutes
    label: "POST /action (IntentDTO)"
    edge_type: thick
  - from: DeltaBuffer
    to: NPCStateAdapter
    label: "dict → NPCState → _apply_deltas → write_to_legacy → dict"
  - from: TickOrchestrator
    to: AffectivePipeline
    label: "calls _run_affective_pipeline(ctx)"
  - from: StateApplicator
    to: LifeEngine
    label: "update_cache(campaign_id, npc_dicts)"
  - from: LifeEngine
    to: SqlitePersistenceAdapter
    label: "load_npc_runtime — SQLite read-back"
  - from: StateApplicator
    to: AvatarPresentationAssembler
    label: "player_dict.body_state → AvatarStateDTO"
  - from: TickOrchestrator
    to: DRFBus
    label: "owns self._drf_bus (instance-level)"
  - from: TickOrchestrator
    to: MemoryManager
    label: "_phase_3_memory (compress idle, promote on event)"
  - from: TickOrchestrator
    to: BehaviorMaskEvaluator
    label: "_phase_5_decision (evaluates mask before DecisionHub)"
  - from: TickOrchestrator
    to: BreakProgressEngine
    label: "calculates will_state breaks"
    code_ref: "tick_orchestrator.py:_phase_5_decision"
  - from: BreakProgressEngine
    to: L1Chronicle
    label: "commits TraitDriftEvent (target_id, effect_value)"
    code_ref: "break_progress_engine.py"
    adr_ref: "ADR-O-208.1"
  - from: L1Chronicle
    to: SQLiteDB
    label: "persists events to l1_chronicle_events"
    adr_ref: "ADR-O-208.2"
  - from: DeltaBuffer
    to: L1Chronicle
    label: "appends TraitDriftEvent from IdentityPayload"
  - from: L1Chronicle
    to: DriveResolver
    label: "provides weighted history (L1)"
  - from: DriveResolver
    to: EffectiveDrives
    label: "computes ephemeral projection (L3)"
  - from: L1Chronicle
    to: PatternDetector
    label: "query_raw() → List[TraitDriftEvent]"
    adr_ref: "ADR-O-305A"
  - from: PatternDetector
    to: EvidenceOfPersistence
    label: "detect() → List[EvidenceOfPersistence]"
  - from: EvidenceOfPersistence
    to: BeliefCrystallizationEngine
    label: "aggregated statistics"
  - from: BeliefCrystallizationEngine
    to: CrystallizedBeliefStore
    label: "crystallize() → update_beliefs()"
    adr_ref: "ADR-O-305"
  - from: CrystallizedBeliefStore
    to: CrystallizedBeliefModifierResolver
    label: "get_beliefs() → List[CrystallizedBelief]"
  - from: CrystallizedBeliefModifierResolver
    to: DecisionHub
    label: "resolve() → drive_modifiers (Dict[str, float])"
constraints:
  - source: LifeEngine
    target: NPC_Position
    rule: "FORBIDDEN: Direct mutation (ADR-051)"
  - source: Any
    target: State
    rule: "FORBIDDEN: Bypass DeltaBuffer"
  - source: TickOrchestrator
    target: Time
    rule: "FORBIDDEN: TICK_CATCHUP loops (ADR-047)"
  - source: TickOrchestrator
    target: TickContext
    rule: "FORBIDDEN: Emergency SpatialService build when cache exists (ADR-065)"
  - source: TickOrchestrator
    target: TickContext
    rule: "FORBIDDEN: Use location_id as campaign_id (ADR-089)"
  - source: DMAgent
    target: FakeNarrative
    rule: "FORBIDDEN: Fake narrative fallback on LLM failure (ADR-113)"
    severity: HIGH
  - source: NPCStateAdapter
    target: NPCState
    rule: "REQUIRED: Round-trip integrity (ADR-117)"
    severity: CRITICAL
  - source: LifeEngine
    target: LifeEngine
    rule: "REQUIRED: update_cache() called after every apply_batch (ADR-117)"
    severity: CRITICAL
  - source: LifeEngine
    target: SqlitePersistenceAdapter
    rule: "REQUIRED: SQLite read-back on cache miss (ADR-128)"
    severity: CRITICAL
  - source: GameLoop
    target: PlayerAction
    rule: "REQUIRED: Action Eligibility Gate (ADR-131)"
    severity: CRITICAL
  - source: AvatarPresentationAssembler
    target: pain_fatigue
    rule: "REQUIRED: Normalize pain/fatigue /100.0 (ADR-094 MSOC)"
    severity: CRITICAL
  - source: PressureTranslator
    target: pain
    rule: "REQUIRED: Normalize pain /100.0 (ADR-094 MSOC)"
    severity: CRITICAL
  - source: AvatarStateDTO
    target: life_status
    rule: "REQUIRED: AvatarStateDTO MUST contain life_status field (ADR-137)"
    severity: HIGH
  - source: TickOrchestrator
    target: DRFBus
    rule: "FORBIDDEN: DRFBus via default_factory in _TickContext (ADR-134)"
    severity: CRITICAL
  - source: AffectivePipeline
    target: affective_load
    rule: "REQUIRED: Asymmetric Attractor (Hysteresis). NO leaky integrator (ADR-138)"
    severity: CRITICAL
  - source: ProjectionEngine
    target: SpatialService
    rule: "FORBIDDEN: SpatialService query inside apply_changes (Rule 117, ADR-O-201)"
    severity: CRITICAL
  - source: ProjectionEngine
    target: RNG
    rule: "FORBIDDEN: RNG inside apply_changes (Rule 118, ADR-O-201)"
    severity: CRITICAL
  - source: ProjectionEngine
    target: Pathfinding
    rule: "FORBIDDEN: Pathfinding inside apply_changes (Rule 119, ADR-O-201)"
    severity: CRITICAL
  - source: ProjectionEngine
    target: TraversalState
    rule: "FORBIDDEN: Traversal creation inside apply_changes (Rule 120, ADR-O-201)"
    severity: CRITICAL
  - source: Any
    target: L1Chronicle
    rule: "FORBIDDEN: Deletion from L1Chronicle (Append-only history) (ADR-O-208)"
    severity: CRITICAL
  - source: Any
    target: EffectiveDrives
    rule: "FORBIDDEN: Caching EffectiveDrives (L3-P1 is strictly ephemeral) (ADR-O-208)"
    severity: CRITICAL
  - source: StateApplicator
    target: OntologyViolationError
    rule: "REQUIRED: Raise OntologyViolationError and kill tick on NaN, sum!=1.0, or bounds violation (ADR-O-207)"
    severity: CRITICAL
  - source: LifeEngine
    target: MovingNPC
    rule: "FORBIDDEN: LifeEngine generating intents for NPC in status MOVING (ADR-154)"
    severity: CRITICAL
  - source: ProjectionEngine
    target: ActiveTraversal
    rule: "FORBIDDEN: apply_changes overwriting active traversal with status MOVING (ADR-130.1)"
    severity: CRITICAL
  - source: ProjectionEngine
    target: TraversalComplete
    rule: "FORBIDDEN: Creating new TraversalState for cause=traversal_complete. MUST snap local_position (ADR-130.2)"
    severity: CRITICAL
  - source: EventCompiler
    target: NullCoordinate
    rule: "FORBIDDEN: Using None for SpatialResolution.target_xy. MUST use (0.0, 0.0) fallback (ADR-O-201.3)"
    severity: CRITICAL
  - source: EquivalenceValidator
    target: CrossLocationTopology
    rule: "FORBIDDEN: validate_topology for cross-location transitions. Nodes are physically different (ADR-O-201.2)"
    severity: HIGH
  - source: TickOrchestrator
    target: NPCState
    rule: "FORBIDDEN: Using NPCState.from_legacy. MUST use NPCStateAdapter.from_legacy (ADR-S85.1.1)"
    severity: HIGH
  - source: BreakProgressEngine
    target: TraitDriftEvent
    rule: "FORBIDDEN: Using legacy fields (npc_id, tick, trait, delta). MUST use (target_id, tick_id, effect_value) (ADR-O-208.1)"
    severity: CRITICAL
  - source: StateApplicator
    target: HP
    rule: "FORBIDDEN: Direct write to state.hp. MUST write to body_state['current_hp'] (ADR-HP-UNIFICATION)"
    severity: CRITICAL
  - source: CalibrationEngine
    target: DrivesRuntime
    rule: "FORBIDDEN: Applying ctx.drives_updates to state.drives_runtime. CalibrationEngine MUST be pass-through (ADR-O-211)"
    severity: CRITICAL
  - source: MemoryManager
    target: IdentityPromotion
    rule: "FORBIDDEN: check_identity_promotion in idle ticks without phase_2_events. Prevents phantom identity drift (ADR-S86.7)"
    severity: CRITICAL
  - source: PatternDetector
    target: EventType
    rule: "FORBIDDEN: Using event_type in mathematical formulas (ADR-O-305A)"
    severity: CRITICAL
  - source: PatternDetector
    target: Psychology
    rule: "FORBIDDEN: PatternDetector reading emotions, drives, or beliefs (ADR-O-306)"
    severity: CRITICAL
  - source: BeliefCrystallizationEngine
    target: L1Chronicle
    rule: "FORBIDDEN: BeliefCrystallizationEngine reading L1Chronicle directly. MUST use EvidenceOfPersistence (ADR-O-305)"
    severity: CRITICAL
  - source: BeliefCrystallizationEngine
    target: CrystallizedBelief
    rule: "REQUIRED: Asymmetric Trauma (x6 multiplier) and Belief Decay Model (ADR-O-307 / ADR-O-305.1)"
    severity: CRITICAL
ownership:
  DeltaBuffer:
    owner: "TickOrchestrator"
    constraint: "ALL state mutations MUST go through DeltaBuffer."
  TickContext:
    owner: "TickOrchestrator"
  PipelineContext:
    owner: "TickOrchestrator"
  WorldSnapshotDTO:
    owner: "WorldSnapshotBuilder"
    constraint: "Snapshot is a PROJECTION, not state."
  NPCStateAdapter_Round_Trip:
    owner: "StateApplicator"
    constraint: "CRITICAL: Core fields in NPCState MUST have both read and write."
  LifeEngine_Cache:
    owner: "LifeEngine"
    constraint: "CRITICAL: After apply_batch mutates npc_dict, LifeEngine._npc_cache MUST be updated."
  MovementLock:
    owner: "LifeEngine (_simulate_major)"
    constraint: "CRITICAL: LifeEngine MUST NOT generate intents for NPCs with active traversals (ADR-154)."
  SnapshotKernel:
    owner: "TickOrchestrator"
    constraint: "CRITICAL: Snapshot = frozen reality for tick t."
  EventCompiler:
    owner: "TickOrchestrator"
    constraint: "CRITICAL: ONLY place where pathfinding, boundary logic exist. MUST use (0.0, 0.0) fallback."
  ProjectionEngine:
    owner: "SceneStateManager (apply_change refactored)"
    constraint: "CRITICAL: Pure projection. MUST snap position on traversal_complete. MUST NOT overwrite MOVING traversals."
  L1Chronicle_Ownership:
    owner: "BreakProgressEngine / npc_tick_pipeline"
    constraint: "CRITICAL: Append-only. Uses new TraitDriftEvent contract (target_id, tick_id). Backed by SQLite."
  BreakProgressEngine_Ownership:
    owner: "TickOrchestrator (_phase_5_decision)"
    creates: "TraitDriftEvent with ADR-O-305A fields"
    constraint: "CRITICAL: MUST use NPCStateAdapter.from_legacy. MUST use new TraitDriftEvent fields."
  HP_Unification_Ownership:
    owner: "StateApplicator / NPCState"
    constraint: "CRITICAL: body_state['current_hp'] is canonical. state.hp is deprecated projection."
  CrystallizedBeliefStore_Ownership:
    owner: "TickOrchestrator (Phase 9)"
    creates: "CrystallizedBelief"
    constraint: "CRITICAL: Belief Engine must not bypass store."
sequences:
  - title: "Pipeline Tick Execution Flow"
    participants: [TickOrchestrator, LifeEngine, DeltaBuffer, StateApplicator, SQLiteDB]
    steps:
      - from: TickOrchestrator
        to: LifeEngine
        message: "1. Run tick_decisions() (Skips MOVING NPCs)"
      - from: LifeEngine
        to: DeltaBuffer
        message: "2. Push StateDeltas"
        type: dotted
      - from: TickOrchestrator
        to: StateApplicator
        message: "3. Trigger apply_batch() (Writes to body_state['current_hp'])"
      - from: StateApplicator
        to: SQLiteDB
        message: "4. Atomic commit"
  - title: "Causal Kernel Pipeline Flow (ADR-O-201)"
    participants: [TickOrchestrator, SnapshotKernel, EventCompiler, ThickSceneChange, ProjectionEngine, WorldState]
    steps:
      - from: TickOrchestrator
        to: SnapshotKernel
        message: "1. Create immutable snapshot"
      - from: SnapshotKernel
        to: EventCompiler
        message: "2. Frozen snapshot + NPC intents"
      - from: EventCompiler
        to: ThickSceneChange
        message: "3. compile() → ThickSceneChange (with boundary fix & 0.0 fallback)"
      - from: ThickSceneChange
        to: ProjectionEngine
        message: "4. Apply physical contracts"
      - from: ProjectionEngine
        to: WorldState
        message: "5. state[t+1] = state[t] ⊕ ThickSceneChange[]"
  - title: "Traversal Complete Snap Flow (ADR-130.2)"
    participants: [TickOrchestrator, SceneChange, ProjectionEngine, SceneState]
    steps:
      - from: TickOrchestrator
        to: SceneChange
        message: "1. Emits SceneChange(cause='traversal_complete')"
      - from: SceneChange
        to: ProjectionEngine
        message: "2. apply_changes receives change"
      - from: ProjectionEngine
        to: SceneState
        message: "3. Snaps local_position to target node coordinates. DOES NOT create new TraversalState."
  - title: "Identity & Belief Crystallization Flow (ADR-O-305)"
    participants: [WorldPressure, L1Chronicle, SQLiteDB, PatternDetector, BeliefCrystallizationEngine, CrystallizedBeliefStore, DecisionHub]
    steps:
      - from: WorldPressure
        to: L1Chronicle
        message: "1. Append TraitDriftEvent (target_id, tick_id, effect_value)"
      - from: L1Chronicle
        to: SQLiteDB
        message: "2. Persist to l1_chronicle_events (ADR-O-208.2)"
      - from: L1Chronicle
        to: PatternDetector
        message: "3. query_raw() → List[TraitDriftEvent]"
      - from: PatternDetector
        to: BeliefCrystallizationEngine
        message: "4. detect() → List[EvidenceOfPersistence] (pure statistics)"
      - from: BeliefCrystallizationEngine
        to: CrystallizedBeliefStore
        message: "5. crystallize(drives_base) → CrystallizedBelief (with x6 trauma & decay)"
      - from: CrystallizedBeliefStore
        to: DecisionHub
        message: "6. resolve() → drive_modifiers (injects into utility scoring)"
  - title: "Memory Promotion & Behavior Mask Flow (S86)"
    participants: [TickOrchestrator, MemoryManager, BehaviorMaskEvaluator, DecisionHub]
    steps:
      - from: TickOrchestrator
        to: MemoryManager
        message: "1. _phase_3_memory: compress_narrative_cache (idle). check_identity_promotion (ONLY if phase_2_events)"
      - from: TickOrchestrator
        to: BehaviorMaskEvaluator
        message: "2. _phase_5_decision: Evaluate WillState & relationships for COLLAPSE/FAKE_SUBMISSION/BETRAYAL"
      - from: BehaviorMaskEvaluator
        to: DecisionHub
        message: "3. Apply mask to utility scoring"