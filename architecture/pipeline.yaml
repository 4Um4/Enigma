domain: PIPELINE
description: "Фундамент симуляции и время. Дискретная каузальность, мутации только через DeltaBuffer. Идентичность — поле дрейфа."
nodes:
  TickOrchestrator:
    type: service
    layer: Application
    label: "Tick Orchestrator"
    style: {fill: "#e1f5fe", stroke: "#0277bd", "stroke-width": "4px"} # Выделен жирным
  LifeEngine:
    type: service
    layer: Application
    label: "Life Engine (De-godified)"
  DeltaBuffer:
    type: queue
    layer: Domain
    label: "Delta Buffer (Event Bus)"
  StateApplicator:
    type: service
    layer: Application
    label: "State Applicator"
  CognitiveOverlay:
    type: service
    layer: Application
    label: "Cognitive Overlay (T+0)"
  SQLiteDB:
    type: database
    layer: Infrastructure
    label: "Runtime SQLite"
  LlamaServer:
    type: external
    layer: Infrastructure
    label: "LLM API (llama-server :8080)"
  TickContext:
    type: dto
    layer: Application
    label: "Tick Context"
  BehaviorManifestationService:
    type: service
    layer: Application
    label: "Behavior Manifestation Service"
  PhenomenologyProjectionService:
    type: service
    layer: Application
    label: "Phenomenology Projection Service"
  WorldSnapshotBuilder:
    type: service
    layer: Application
    label: "World Snapshot Builder"
  EmbodiedTraceDTO:
    type: dto
    layer: Domain
    label: "Embodied Trace DTO"
  PlayerPerceptionDTO:
    type: dto
    layer: Domain
    label: "Player Perception DTO"
  DMAgent:
    type: service
    layer: Application
    label: "DM Agent (Narrative)"
  PipelineContext:
    type: dto
    layer: Application
    label: "Pipeline Context"
  NPCStateAdapter:
    type: service
    layer: Application
    label: "NPCState Adapter (Serialization Bridge)"
    description: "from_legacy / write_to_legacy — единственная точка конвертации dict↔NPCState. Round-trip integrity = architectural law."
    code_ref: "npc_state.py:635-800"
  SqlitePersistenceAdapter:
    type: service
    layer: Infrastructure
    label: "SQLite Persistence Adapter"
    description: "Key-value JSON blob storage. json.dumps with default handler for set types."
    code_ref: "state/sqlite_persistence_adapter.py"
  JsonPersistenceAdapter:
    type: service
    layer: Infrastructure
    label: "JSON Persistence Adapter (Legacy)"
    description: "JSON file-based persistence. Used when SQLite not available."
    code_ref: "state/json_persistence_adapter.py"
  AffectivePipeline:
    type: service
    layer: Application
    label: "Affective Pipeline (_run_affective_pipeline)"
    description: "Runs in BOTH idle and player turn. Calculates target_load from PK+body_state, then applies Asymmetric Attractor (Hysteresis) to affective_load. Growth fast (0.30), decay slow (0.05+will*0.1). AFFECTIVE_BOOT KILLED."
    code_ref: "tick_orchestrator.py:_run_affective_pipeline"
    adr_ref: "ADR-138"
  AffectiveDecayHandler:
    type: service
    layer: Application
    label: "Affective Decay Handler (Phase 0.5)"
    description: "Idle tick handler. Decrements affective_load by recovery rate. Triggers PerceptualKernel idle decay (threat/uncertainty/anomaly) to prevent Perpetual Fear Engine. Calls update_cache after deltas."
    code_ref: "affective/affective_decay_handler.py, tick_orchestrator.py:_phase_0_5_idle_services"
    adr_ref: "ADR-138"
  AvatarPresentationAssembler:
    type: service
    layer: Application
    label: "Avatar Presentation Assembler"
    description: "Translates player_dict (body_state, psyche) into AvatarStateDTO (phenomenological projection). Reads life_status from body_state for death feedback. NORMALIZES pain/fatigue /100.0 (ADR-094 MSOC). DEAD override: all projections zeroed, posture=collapsed, breathing=none."
    code_ref: "presentation/avatar_presentation_assembler.py"
    adr_ref: "ADR-137, ADR-094"
  AvatarStateDTO:
    type: dto
    layer: Domain
    label: "Avatar State DTO (Phenomenological Projection)"
    description: "Frontend projection of player state. Contains NO internal metrics (HP, fear). Only perceptual scalars, motor disruption, blood visibility, and life_status. Frontend renders death overlay when life_status=DEAD (ADR-137). PhysicalPresentationState enum includes DEAD state."
    code_ref: "domain/snapshot.py"
    adr_ref: "ADR-137"
  PressureTranslator:
    type: service
    layer: Application
    label: "Pressure Translator (Somatic Veto)"
    description: "Translates PerceptualKernel + body_state into DecisionContext (feasibility constraints). NORMALIZES pain /100.0 (ADR-094 MSOC). Somatic Veto: pain>0.8 blocks FLEE, shock>0.7 blocks ATTACK, blood_loss>0.6 limits physical actions."
    code_ref: "cfrm/pressure_translator.py"
    adr_ref: "ADR-094, GAP3"
  DRFBus:
    type: queue
    layer: Application
    label: "DRF Bus (Causal Field Bus)"
    description: "Instance-level bus for DRF claims. Owned by TickOrchestrator (self._drf_bus). FORBIDDEN: default_factory per _TickContext (split-brain, ADR-134). Cleared at start of execute()."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-134"
  DRFExecutionContext:
    type: dto
    layer: Application
    label: "DRF Execution Context (Scoped Causal Ledger)"
    description: "Scoped causal ledger: tick_id + npc_id + bus. Created by TickOrchestrator, scoped per NPC via for_npc(). Replaces bare drf_bus parameter (ADR-136)."
    code_ref: "tick_orchestrator.py, npc_tick_pipeline.py"
    adr_ref: "ADR-136"
  SnapshotKernel:
    type: dto
    layer: Domain
    label: "WorldSnapshot (Immutable Reality Slice)"
    description: "ADR-O-201: Замороженный срез вселенной в момент t. Содержит spatial_graph, npc_state, traversal_state, boundary_map, rng_seed. Только значения, никаких live-объектов. Единственная реальность, доступная системе."
    code_ref: "models/world_snapshot.py (NEW)"
    adr_ref: "ADR-O-201"
  EventCompiler:
    type: service
    layer: Application
    label: "Event Compiler (Physics Generator)"
    description: "ADR-O-201: Единственное место, где существует геометрия, pathfinding, boundary logic, RNG, AI decision. НЕ изменяет мир. Вычисляет все последствия заранее. Snapshot → ThickSceneChange[]."
    code_ref: "services/event_compiler.py (NEW)"
    adr_ref: "ADR-O-201"
  ThickSceneChange:
    type: dto
    layer: Domain
    label: "Thick Scene Change (Full Physical Contract)"
    description: "ADR-O-201: SceneChange с полной вычисленной физикой. Содержит SpatialResolution, MotionPlan, BoundaryResolution. Редьюсер применяет без вычислений."
    code_ref: "models/thick_scene_change.py (NEW)"
    adr_ref: "ADR-O-201"
  EquivalenceValidator:
    type: service
    layer: Application
    label: "Equivalence Validator (Drift Detector + DEPRECATION Layer)"
    description: "ADR-O-201 ФАЗА 2: Суд причинности. 4 метода валидации. 5 классов drift. DEPRECATION-слой маппит drift на Rule-номера мутаций apply_change. Переключение власти только при 0 C/D/E drift за 100k+ comparisons."
    code_ref: "services/equivalence_validator.py"
    adr_ref: "ADR-O-201"
  ProjectionEngine:
    type: service
    layer: Application
    label: "Projection Engine (Pure State Writer)"
    description: "ADR-O-201: Чистая функция проекции. state[t+1] = state[t] ⊕ ThickSceneChange[]. ЗАПРЕЩЕНО: pathfinding, spatial queries, RNG, decision making, branching >1 уровня."
    code_ref: "scene_state_manager.py (apply_change refactored)"
    adr_ref: "ADR-O-201"
  GameLoop:
    type: service
    layer: Application
    label: "Game Loop (Pipeline Controller)"
    description: "Orchestrates player turn, idle tick, DM phases. Owns _load_npcs_with_runtime and TickBuffer. Contains Action Eligibility Gate (ADR-131)."
    code_ref: "game_loop/__init__.py"
    adr_ref: "ADR-131"
  # --- IDENTITY LAYER (DOM-10) ---
  L1Chronicle:
    type: domain
    layer: Domain
    label: "L1 Chronicle (Append-Only History)"
    description: "ADR-O-208: Append-only хранилище событий деформации идентичности. Удаление запрещено. Записывает TraitDriftEvent."
    code_ref: "services/npc/l1_chronicle.py"
    adr_ref: "ADR-O-208"
  DriveResolver:
    type: domain
    layer: Domain
    label: "Drive Resolver (Pure Function L0+L1→L3)"
    description: "ADR-O-208: Чистая функция вычисления проекции драйвов. Не имеет состояния."
    code_ref: "services/npc/drive_resolver.py"
    adr_ref: "ADR-O-208"
  EffectiveDrives:
    type: dto
    layer: Domain
    label: "Effective Drives (Ephemeral L3 Projection)"
    description: "ADR-O-208: Эфемерная, неизменяемая проекция драйвов (MappingProxyType). Запрещено кэшировать (L3-P1)."
    code_ref: "domain/identity_events.py"
    adr_ref: "ADR-O-208"
  CalibrationEngine:
    type: service
    layer: Application
    label: "Calibration Engine (Pass-through / Deprecated for scalars)"
    description: "ADR-O-211 DEPRECATION: Попытка стабилизации скалярных драйвов провалилась (Test C: интеграл шума). Переведён в pass-through. Кристаллизация перенесена в Belief Layer."
    code_ref: "services/npc/calibration_engine.py"
    adr_ref: "ADR-O-211"
  PatternDetector:
    type: service
    layer: Application
    label: "Pattern Detector (Source Grouping & Noise Filter)"
    description: "ADR-O-305: Группирует L1Chronicle события по полю source. Если частота появления source превышает шумовой порог, генерирует EvidenceOfPersistence."
    status: PROPOSED
    adr_ref: "ADR-O-305"
  BeliefCrystallizationEngine:
    type: service
    layer: Application
    label: "Belief Crystallization Engine"
    description: "ADR-O-305: Преобразует устойчивые паттерны в семантические убеждения ('волки=опасность'). Инжектит сдвиги политики в DecisionHub."
    status: PROPOSED
    adr_ref: "ADR-O-305"
  OntologyViolationError:
    type: domain
    layer: Domain
    label: "Ontology Violation Error (L5 Post-Commit Guard)"
    description: "ADR-O-207: Выбрасывается при нарушении Закона Сохранения Я (sum!=1.0), выходе за границы [0,1] или NaN. Убивает тик."
    code_ref: "domain/exceptions.py"
    adr_ref: "ADR-O-207"
  IntentDomain:
    type: domain
    layer: Domain
    label: "Intent Domain (SURVIVAL/SOCIAL/ROUTINE/EXPLORATION)"
    description: "ADR-O-137: Онтологический базис намерений. Viability mask проекция PerceptualKernel → IntentDomain."
    code_ref: "domain/movement.py"
    adr_ref: "ADR-O-137"
edges:
  - from: LifeEngine
    to: DeltaBuffer
    label: "emits intents & deltas"
    condition: "tick_decisions() produces StateDeltas"
    code_ref: "life_engine.py"
    adr_ref: "ADR-051"
    edge_type: thick # Жирная линия - основной поток
  - from: PerceptualKernel
    to: LifeEngine
    label: "threat_gradient + recent_directive → Arousal Gate wake_pressure"
    condition: "ADR-O-142A: Arousal Gate reads PK to compute wake_pressure."
    code_ref: "life_engine.py:_arousal_gate()"
    adr_ref: "ADR-O-142A"
    edge_type: dotted
  - from: LifeEngine
    to: SceneStateManager
    label: "SceneChange(activity='', cause='arousal_gate') → apply_changes()"
    condition: "ADR-O-142A: Arousal Gate produces SceneChange for wake transition."
    code_ref: "life_engine.py:_arousal_gate()"
    adr_ref: "ADR-O-142A"
    edge_type: dotted
  - from: TickOrchestrator
    to: DeltaBuffer
    label: "aggregates Phase 8 results"
    condition: "Always on tick"
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-066"
  - from: DeltaBuffer
    to: StateApplicator
    label: "apply_batch()"
    condition: "Aggregated at end of tick"
    code_ref: "state_applicator.py"
    adr_ref: "ADR-001"
    edge_type: thick
  - from: CognitiveOverlay
    to: StateApplicator
    label: "injects shock_impulse > 0.5"
    condition: "shock_impulse > 0.5 (T+0 injection)"
    code_ref: "tick_orchestrator.py:634"
    adr_ref: "GAP1 FIX"
    edge_type: dotted # Пунктир - инъекция в обход буфера
  - from: StateApplicator
    to: SQLiteDB
    label: "commits state"
    condition: "Atomic commit"
    code_ref: "state_applicator.py"
  - from: StateApplicator
    to: BehaviorManifestationService
    label: "reads npc_positions (body_state only: pain/blood_loss/shock)"
    condition: "Phase 8.5. Rule X: motor traces ONLY from physiology."
    code_ref: "behavior_manifestation_service.py"
    adr_ref: "The Fool v2, ADR-112"
  - from: BehaviorManifestationService
    to: PhenomenologyProjectionService
    label: "EmbodiedTraceDTO"
    condition: "Phase 9"
    code_ref: "phenomenology_projection_service.py"
    adr_ref: "The Fool v2"
  - from: PhenomenologyProjectionService
    to: WorldSnapshotBuilder
    label: "Domain PlayerPerceptionDTO"
    condition: "Phase 9"
    code_ref: "world_snapshot_builder.py"
    adr_ref: "The Fool v2"
  - from: WorldSnapshotBuilder
    to: APIRoutes
    label: "Canonical PlayerPerceptionDTO (peripheral_cues, embodied_traces)"
    condition: "API Response"
    code_ref: "routes.py"
    adr_ref: "The Fool v2"
  - from: TickOrchestrator
    to: LlamaServer
    label: "query LLM (3 retries, backoff 1s/2s/2s, partial stream recovery)"
    condition: "Action tick. ADR-113: Honest error on permanent failure."
    code_ref: "llama_cpp_provider.py"
    adr_ref: "ADR-113"
    edge_type: dotted
  - from: GameScreen
    to: APIRoutes
    label: "POST /action (IntentDTO)"
    condition: "On Enter key."
    code_ref: "intent_compressor.py:93-98"
    edge_type: thick
  - from: TickOrchestrator
    to: TickContext
    label: "creates context"
    condition: "Must use authentic campaign_id"
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-089"
  - from: TickOrchestrator
    to: PipelineContext
    label: "writes player_perception"
    condition: "Phase 9: embodied_traces from PhenomenologyProjection"
    code_ref: "tick_orchestrator.py:712"
    adr_ref: "ADR-093"
  - from: PipelineContext
    to: DMAgent
    label: "reads embodied_traces (observable symptoms only)"
    condition: "The Fool: DM sees traces, not internal states"
    code_ref: "dm_agent.py:309-324"
    adr_ref: "ADR-093"
  - from: DeltaBuffer
    to: NPCStateAdapter
    label: "dict → NPCState → _apply_deltas → write_to_legacy → dict"
    condition: "Every apply_batch call. Round-trip MUST preserve all fields."
    code_ref: "state_applicator.py:742-776"
    adr_ref: "ADR-117"
  - from: NPCStateAdapter
    to: SqlitePersistenceAdapter
    label: "npc_dict → json.dumps → state_kv table"
    condition: "Commit via SceneStateManager.atomic_commit."
    code_ref: "sqlite_persistence_adapter.py:71-77"
    adr_ref: "ADR-117"
  - from: TickOrchestrator
    to: AffectivePipeline
    label: "calls _run_affective_pipeline(ctx)"
    condition: "Phase 9: target_load derived from PK+body. Integral relaxes via Hysteresis."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-138"
  - from: AffectiveDecayHandler
    to: DeltaBuffer
    label: "EmotionPayload (decay deltas for affective_load, emotion_tag)"
    condition: "Idle tick. Phase 0.5."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-138"
  - from: AffectivePipeline
    to: DeltaBuffer
    label: "EmotionPayload (affective_load, emotion_tag, stress_delta)"
    condition: "On threshold crossing or sustaining"
    code_ref: "tick_orchestrator.py:_run_affective_pipeline"
    adr_ref: "ADR-117"
  - from: StateApplicator
    to: LifeEngine
    label: "update_cache(campaign_id, npc_dicts)"
    condition: "After apply_batch — persist mutated data between ticks"
    code_ref: "life_engine.py:779-786"
    adr_ref: "ADR-117"
  - from: LifeEngine
    to: SqlitePersistenceAdapter
    label: "load_npc_runtime(campaign_id) — SQLite read-back on cache miss"
    condition: "ADR-128: При TTL/LRU eviction восстановление из SQLite."
    code_ref: "life_engine.py:_load_npcs"
    adr_ref: "ADR-128"
  - from: GameLoop
    to: LifeEngine
    label: "get_npc_states(campaign_id) — cache first, file fallback"
    condition: "_load_npcs_with_runtime MUST check LifeEngine cache before load_npcs_merged."
    code_ref: "game_loop/__init__.py:214-218"
    adr_ref: "ADR-117"
  - from: StateApplicator
    to: AvatarPresentationAssembler
    label: "player_dict.body_state → AvatarStateDTO (phenomenological projection)"
    condition: "Assembler reads life_status. NORMALIZES pain/fatigue /100.0 (ADR-094)."
    code_ref: "avatar_presentation_assembler.py:21-126"
    adr_ref: "ADR-137, ADR-094"
  - from: AvatarPresentationAssembler
    to: AvatarStateDTO
    label: "assemble_avatar_presentation → AvatarStateDTO with life_status"
    condition: "AvatarStateDTO includes life_status field."
    code_ref: "snapshot.py:34-56"
    adr_ref: "ADR-137"
  - from: AvatarStateDTO
    to: WorldSnapshotBuilder
    label: "AvatarStateDTO embedded in WorldSnapshotDTO"
    condition: "WorldSnapshotDTO.avatar_state carries phenomenological projection."
    code_ref: "snapshot.py:157"
    adr_ref: "ADR-035"
  - from: PerceptualKernel
    to: PressureTranslator
    label: "kernel + body_state → DecisionContext (feasibility constraints)"
    condition: "NORMALIZES pain /100.0. Somatic Veto: pain>0.8 blocks FLEE."
    code_ref: "pressure_translator.py:51-64"
    adr_ref: "ADR-094, GAP3"
  - from: TickOrchestrator
    to: DRFBus
    label: "owns self._drf_bus (instance-level, not per _TickContext)"
    condition: "ADR-134: Both execute() and execute_player_finalize() pass drf_bus=self._drf_bus."
    code_ref: "tick_orchestrator.py"
    adr_ref: "ADR-134"
  - from: DRFBus
    to: DRFExecutionContext
    label: "drf_ctx = DRFExecutionContext(tick_id, npc_id, bus) — scoped per NPC"
    condition: "ADR-136: Claims auto-inherit npc_id and tick_id via drf_ctx.emit()."
    code_ref: "tick_orchestrator.py, npc_tick_pipeline.py"
    adr_ref: "ADR-136"
  # --- IDENTITY EDGES ---
  - from: DeltaBuffer
    to: L1Chronicle
    label: "appends TraitDriftEvent from IdentityPayload"
    condition: "World pressure mutates identity (ADR-O-208)"
    code_ref: "l1_chronicle.py"
    adr_ref: "ADR-O-208"
  - from: L1Chronicle
    to: DriveResolver
    label: "provides weighted history (L1)"
    condition: "Tick start"
    code_ref: "drive_resolver.py:resolve_drives"
    adr_ref: "ADR-O-208"
  - from: DriveResolver
    to: EffectiveDrives
    label: "computes ephemeral projection (L3)"
    condition: "Pure function from archetype + chronicle"
    code_ref: "drive_resolver.py"
    adr_ref: "ADR-O-208"
  - from: EffectiveDrives
    to: CalibrationEngine
    label: "checks for oscillation"
    condition: "Post-resolution (ADR-O-211)"
    code_ref: "calibration_engine.py"
    adr_ref: "ADR-O-211"
  - from: EffectiveDrives
    to: DecisionHub
    label: "modulates utility deformation and risk perception"
    condition: "Replaces hardcoded weights (§ENIGMA-S72)"
    adr_ref: "ADR-O-146"
  - from: EffectiveDrives
    to: PressureTranslator
    label: "provides willpower for Somatic Urgency modulation"
    condition: "ADR-O-143: somatic_urgency * (1.0 - willpower * 0.5)"
    adr_ref: "ADR-O-143"
  - from: PerceptualKernel
    to: IntentDomain
    label: "Viability mask projection"
    condition: "ADR-O-137: threat_gradient > 0.3 excludes ROUTINE domain"
    adr_ref: "ADR-O-137"
constraints:
  - source: LifeEngine
    target: NPC_Position
    rule: "FORBIDDEN: Direct mutation (ADR-051)"
    adr_ref: "De-godification"
  - source: Any
    target: State
    rule: "FORBIDDEN: Bypass DeltaBuffer"
    adr_ref: "Core Pipeline"
  - source: TickOrchestrator
    target: Time
    rule: "FORBIDDEN: TICK_CATCHUP loops (ADR-047)"
  - source: TickOrchestrator
    target: TickContext
    rule: "FORBIDDEN: Emergency SpatialService build when cache exists (ADR-065)"
    adr_ref: "ADR-065"
  - source: TickOrchestrator
    target: TickContext
    rule: "FORBIDDEN: Use location_id as campaign_id (ADR-089)"
    adr_ref: "ADR-089"
  - source: DMAgent
    target: FakeNarrative
    rule: "FORBIDDEN: Fake narrative fallback on LLM failure (ADR-113)"
    severity: HIGH
  - source: NPCStateAdapter
    target: NPCState
    rule: "REQUIRED: Round-trip integrity — every field in NPCState must survive from_legacy→write_to_legacy cycle (ADR-117)"
    severity: CRITICAL
  - source: _aggregate_deltas
    target: EmotionPayload
    rule: "REQUIRED: Merge MUST preserve all fields from both payloads (ADR-117)"
    severity: CRITICAL
  - source: StateApplicator
    target: relationship_cache
    rule: "REQUIRED: Partial Social Graph Projection (S69)"
    severity: HIGH
  - source: DecisionHub
    target: relationship_cache
    rule: "REQUIRED: Precedence Contract (Graph > Scalar > Vacuum) via _get_rel_value (S69)"
    severity: HIGH
  - source: TickOrchestrator
    target: IntentParametersDTO
    rule: "DEPRECATED: target_id field (ADR-125)"
    severity: MEDIUM
  - source: LifeEngine
    target: LifeEngine
    rule: "REQUIRED: update_cache() called after every apply_batch (ADR-117)"
    severity: CRITICAL
  - source: LifeEngine
    target: SqlitePersistenceAdapter
    rule: "REQUIRED: SQLite read-back on cache miss (ADR-128)"
    severity: CRITICAL
  - source: PlayerAvatarService
    target: body_state
    rule: "REQUIRED: body_state/affective_load/perceptual_kernel serialization (ADR-128)"
    severity: CRITICAL
  - source: GameLoop
    target: PlayerAction
    rule: "REQUIRED: Action Eligibility Gate — check player life_status BEFORE lock_for_tick (ADR-131)"
    severity: CRITICAL
  - source: AvatarPresentationAssembler
    target: pain_fatigue
    rule: "REQUIRED: Normalize pain/fatigue /100.0 before threshold comparison (ADR-094 MSOC)"
    severity: CRITICAL
  - source: PressureTranslator
    target: pain
    rule: "REQUIRED: Normalize pain /100.0 before Somatic Veto thresholds (ADR-094 MSOC)"
    severity: CRITICAL
  - source: AvatarStateDTO
    target: life_status
    rule: "REQUIRED: AvatarStateDTO MUST contain life_status field (ADR-137)"
    severity: HIGH
  - source: GameLoop
    target: WorldSnapshotDTO
    rule: "REQUIRED: Death Guard MUST include npc_positions in world_snapshot (ADR-137)"
    severity: HIGH
  - source: TickOrchestrator
    target: DRFBus
