domain: IDENTITY
description: "Домен Идентичности и Онтологии (DOM-10). Фазово-заблокированное поле дрейфа. L0 (Архетип) + L1 (Хроника) → L3 (Проекция). Стабилизация скалярных драйвов признана тупиком (Test C). Кристаллизация перенесена в Belief Layer (Убеждения)."
nodes:
  L1Chronicle:
    type: domain
    layer: Domain
    label: "L1 Chronicle (Append-Only)"
  DriveResolver:
    type: domain
    layer: Domain
    label: "Drive Resolver (Pure Function L0+L1→L3)"
  EffectiveDrives:
    type: dto
    layer: Domain
    label: "Effective Drives (Ephemeral L3 Projection)"
  OntologyViolationError:
    type: domain
    layer: Domain
    label: "Ontology Violation Error (L5 Guard)"
  TraitDriftEvent:
    type: dto
    layer: Domain
    label: "Trait Drift Event (L1 Record)"
  CalibrationEngine:
    type: service
    layer: Application
    label: "Calibration Engine (Pass-through / Deprecated for scalars)"
    status: DEPRECATED_FOR_SCALARS
  DecisionHub:
    type: service
    layer: Application
    label: "Decision Hub (Projection-Native Scoring)"
  PatternDetector:
    type: service
    layer: Application
    label: "Pattern Detector (L1 Source Grouping)"
    status: PROPOSED
  BeliefCrystallizationEngine:
    type: service
    layer: Application
    label: "Belief Crystallization (Evidence of Persistence → Semantic Policy)"
    status: PROPOSED
  ArchetypeConfig:
    type: database
    layer: Infrastructure
    label: "Archetype Config JSON (Profession)"
    description: "S85.2: Defines behavioral schedule (routine). Spatial activity_map prohibited."
  IndividualConfig:
    type: database
    layer: Infrastructure
    label: "Individual Config JSON (Position)"
    description: "S85.2: Contains specific activity_map for cross-location routing."
edges:
  - from: TraitDriftEvent
    to: L1Chronicle
    label: "appends drift record"
    condition: "World pressure mutates identity"
    code_ref: "l1_chronicle.py:append"
  - from: L1Chronicle
    to: DriveResolver
    label: "provides weighted history"
    condition: "Tick start"
    code_ref: "drive_resolver.py:resolve_drives"
  - from: DriveResolver
    to: EffectiveDrives
    label: "computes ephemeral projection"
    condition: "Pure function from archetype + chronicle"
    code_ref: "drive_resolver.py"
  - from: EffectiveDrives
    to: CalibrationEngine
    label: "pass-through (no scalar mutation)"
    condition: "ADR-O-211 DEPRECATION: Test C noise accumulation"
    code_ref: "calibration_engine.py"
  - from: CalibrationEngine
    to: DecisionHub
    label: "delivers L3_stable"
    condition: "Projection-native scoring (ADR-O-304)"
    code_ref: "tick_orchestrator.py"
  - from: L1Chronicle
    to: PatternDetector
    label: "query by source, detect persistence frequency"
    condition: "ADR-O-305: Grouping by source field"
    code_ref: "pattern_detector.py (Target)"
  - from: PatternDetector
    to: BeliefCrystallizationEngine
    label: "generate EvidenceOfPersistence"
    condition: "ADR-O-305: Frequency > noise threshold"
    code_ref: "belief_crystallization_engine.py (Target)"
  - from: BeliefCrystallizationEngine
    to: DecisionHub
    label: "inject belief_modifiers / active_traits"
    condition: "ADR-O-305: Source-specific policy shift"
    code_ref: "decision_hub.py"
  - from: ArchetypeConfig
    to: DriveResolver
    label: "provides L0 archetype"
    condition: "Base personality traits and schedule"
    code_ref: "npc_loader.py"
  - from: IndividualConfig
    to: DriveResolver
    label: "merges individual overrides"
    condition: "Specific schedule/activity_map overrides"
    code_ref: "npc_loader.py"
constraints:
  - source: Any
    target: L1Chronicle
    rule: "FORBIDDEN: Deletion from L1Chronicle (Append-only history)"
    code_ref: "ADR-O-208"
  - source: Any
    target: EffectiveDrives
    rule: "FORBIDDEN: Caching EffectiveDrives (L3-P1 is strictly ephemeral)"
    code_ref: "ADR-O-208"
  - source: StateApplicator
    target: OntologyViolationError
    rule: "REQUIRED: Raise OntologyViolationError and kill tick on NaN, sum!=1.0, or bounds violation"
    code_ref: "ADR-O-207"
  - source: CalibrationEngine
    target: EffectiveDrives
    rule: "DEPRECATED for scalar mutation (Test C noise accumulation). Pass-through mode ONLY"
    code_ref: "ADR-O-211 DEPRECATION"
  - source: DecisionHub
    target: EffectiveDrives
    rule: "REQUIRED: Projection-native scoring. L0 (drives_base) prohibited in scoring"
    code_ref: "ADR-O-304"
  - source: BeliefCrystallizationEngine
    target: DecisionHub
    rule: "REQUIRED: Beliefs modify policy via source-specific vectors, NOT abstract scalar fear"
    code_ref: "ADR-O-305"
  - source: PatternDetector
    target: L1Chronicle
    rule: "REQUIRED: Group by source. Do not accumulate noise from uncorrelated events"
    code_ref: "ADR-O-305"
  - source: ArchetypeConfig
    target: SpatialService
    rule: "FORBIDDEN: Storing activity_map with concrete coordinates inside archetypes (ADR-S85.2)"
    condition: "Archetype = Profession (schedule only). Individual = Position (activity_map)."
    adr_ref: "ADR-S85.2"
    code_ref: "config/npc/archetypes/*.json"
    severity: HIGH
  - source: IndividualConfig
    target: SpatialService
    rule: "REQUIRED: Cross-location activity_map MUST be defined in individual config (ADR-S85.2)"
    condition: "Individual defines concrete locations (e.g., city_gate:entrance) for their specific job."
    adr_ref: "ADR-S85.2"
    code_ref: "config/npc/individuals/*.json"
    severity: HIGH