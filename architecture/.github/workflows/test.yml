name: ENIGMA CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pymorphy3
        
    - name: Run tests with pytest
      run: |
        cd backend
        python -m pytest tests/ --tb=short --junitxml=test_results.xml
        
    - name: Type check (mypy strict for domain/models/state)
      run: |
        pip install mypy
        cd backend && mypy app/domain/ app/models/ app/services/state/ --strict --namespace-packages --explicit-package-bases
        
    - name: Type check (mypy soft for services/agents/api)
      run: |
        cd backend && mypy app/services/ app/agents/ app/api/ app/core/ --namespace-packages --explicit-package-bases
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: backend/test_results.xml