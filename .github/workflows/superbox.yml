name: ENIGMA SUPERBOX

on:
  push:
    branches: [ "V.0.5.4.*" ]
  workflow_dispatch:

jobs:
  drift-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run SUPERBOX Drift Test
      run: |
        cd backend
        python -m tests.sandbox.SUPERBOX.run drift replay_determinism
      # S268: полный режим 2 × 10 000 тиков; замер скорости 2026-10-07 — 12.8 тиков/сек
      # (локально и на runner одинаково) → ~26 мин на оба прогона. Старый лимит 5 мин
      # был структурно невыполним: workflow падал по timeout на всех 10 последних пушах.
      timeout-minutes: 60