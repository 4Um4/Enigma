<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<title>Enigma</title>

<style>

body{
background:#0e0e11;
color:#e6e6e6;
font-family:Segoe UI;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#14141a;
padding:12px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

#status{
font-size:12px;
opacity:.7;
}

main{
flex:1;
display:flex;
flex-direction:column;
padding:10px;
}

.chat{
flex:1;
overflow-y:auto;
background:#0b0b0f;
border:1px solid #222;
padding:10px;
margin-bottom:10px;
}

.msg{
margin-bottom:8px;
}

.dm{
color:#7dd3fc;
}

.player{
color:#facc15;
}

.controls{
display:flex;
gap:10px;
}

textarea{
flex:1;
background:#0b0b0f;
border:1px solid #333;
color:white;
padding:8px;
resize:none;
height:60px;
}

button{
background:#2563eb;
border:none;
padding:8px 14px;
color:white;
cursor:pointer;
}

button:disabled{
opacity:.4;
}

select{
background:#0b0b0f;
color:white;
border:1px solid #333;
padding:6px;
}

</style>

</head>

<body>

<header>

<div>
<b>ENIGMA</b>
</div>

<div id="status">
connecting...
</div>

</header>

<main>

<div class="controls">

<select id="playerSelect">
<option value="">Выберите персонажа</option>
<option value="Демеург">Демеург</option>
</select>

</div>

<div id="chat" class="chat"></div>

<div class="controls">

<textarea id="actionInput" placeholder="Опишите действие персонажа..."></textarea>

<button id="sendBtn">Отправить</button>

</div>

</main>

<script>

const API="http://127.0.0.1:8000/api"

const state={
serverOnline:false,
player:null,
campaign:"demo-campaign",
sessionActive:false
}

let heartbeatTimer=null

function log(msg,type="dm"){

const chat=document.getElementById("chat")

const div=document.createElement("div")
div.className="msg "+type
div.innerText=msg

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function setStatus(text){
document.getElementById("status").innerText=text
}

async function checkServer(){

try{

const r=await fetch(API+"/health")
const j=await r.json()

state.serverOnline=true

setStatus("server online")

}catch{

state.serverOnline=false
setStatus("server offline")

}

}

async function loadSession(){

if(!state.player)return

try{

const r=await fetch(API+"/player/session/"+state.campaign)

const j=await r.json()

state.sessionActive=j.active

if(state.sessionActive){

startHeartbeat()

}

}catch{}

}

async function selectPlayer(name){

state.player=name

log("Игрок: "+name,"player")

await createSession()

}

async function createSession(){

try{

await fetch(API+"/player/session/"+state.campaign,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({player:state.player})
})

state.sessionActive=true

startHeartbeat()

}catch{}

}

function startHeartbeat(){

if(heartbeatTimer)return

heartbeatTimer=setInterval(async()=>{

if(!state.sessionActive)return

try{

await fetch(API+"/player/heartbeat",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
player:state.player,
campaign:state.campaign
})
})

}catch{}

},10000)

}

async function sendTurn(){

if(!state.player)return

const text=document.getElementById("actionInput").value

if(!text)return

log(text,"player")

document.getElementById("actionInput").value=""

try{

const r=await fetch(API+"/game/action",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
player:state.player,
campaign:state.campaign,
action:text
})
})

const j=await r.json()

log(j.response,"dm")

}catch{

log("Сервер недоступен")

}

}

function initUI(){

document
.getElementById("playerSelect")
.addEventListener("change",e=>{

if(!e.target.value)return

selectPlayer(e.target.value)

})

document
.getElementById("sendBtn")
.addEventListener("click",sendTurn)

}

async function init(){

initUI()

await checkServer()

if(state.serverOnline){

log("Добро пожаловать в подземелье!")

}

}

init()

</script>

</body>
</html>
